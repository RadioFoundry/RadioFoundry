# How the site draws the radio
[frame]
shape = "handheld"
body = "#1b1c1f"
accent = "#e07a1f"
lens = [30, 30]

# The open-firmware CPS radio types qdmr knows the radio by (docs/spec/cps-protocol.md 2.2), as board.c's hal_cps_t
# reports them
[cps]
radio_types = [6]

# The RT3S is this board in Retevis's own body, which looks nothing like TYT's: its own card and drawing on the site
[[looks]]
id = "rt3s"
name = "Retevis RT3S"
