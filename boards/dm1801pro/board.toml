# The DM-1801 Pro's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and
# the web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in boards/dm1801pro/memory.ld.

id = "dm1801pro"
name = "Baofeng DM-1801 Pro"
maker = "Baofeng"
model = "DM-1801 Pro"
also = ["Baofeng DM-1801"]
kind = "handheld"
# where the radio appears in the site's lists (the lowest: the home page's radio)
order = 2
# Older VERSION board= values that also mean this radio (debug link). The current one is board_t .name (or a
# build option value's board_name), and the id always counts
debuglink_aliases = ["DM-1801Pro"]

[docs]
hardware = "docs/spec/hardware-dm1801pro.md"
codec = "docs/spec/codec-dm1801pro.md"
bringup = "docs/testing/dm1801pro-bringup.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
bands = "136-174 / 400-470 MHz"
power = "L / M / H"
display = "monochrome, 128 × 64"
gallery = "128x64"
clock = { rtc = "backed", note = "the SoC RTC on I2C2 with a 32.768 kHz crystal and a 3 V backup cell (docs/spec/hardware-dm1801pro.md 8.2)" }

[status]
level = "supported"
summary = """\
FM with CTCSS/DCS, DMR voice with the radio's own codec, DMR data and text, the hotspot, single frequency repeating, \
the PPP network services and each split duplex half work on air. Open: VHF transmit and VOX."""
release = "stable"

# The same Baofeng serial updater as the DM-32UV, with its own ID string; the same flash map, the same codec slot and
# the same erase of the whole application area
[flash]
family = "serial-loader"
keep_codec = false
stock_versions = []
backup = { stock = "full", odr = "full", spi_size = 0x1000000 }

# The loader stays in update mode while PTB11 (PTT) and PTB26 both read low; which key PTB26 is isn't known. The web
# flasher has no steps for it yet
[flash.bootloader]
keys = "PTT and the key on PTB26 (probably SK1)"
steps = []
id = "BF1801-V1"

# The universal HR_C7000 stub's board profile (CONFIG, stub/stubtool.py)
[flash.stub]
id = 2
hold_power = false
progmem = 0x100000
tested = true

# The codec slot and windows come from boards/dm1801pro/memory.ld (__codec_*). The codec comes from the radio's own program flash
# (read with stub/stubtool.py), not from a stock file (docs/spec/codec-dm1801pro.md)
[codec]
tool = "hrc7000_codec"
profile = "dm1801pro-049"
sources = ["a program flash read of the radio"]

# How the site draws the radio
[frame]
shape = "handheld-tall"
body = "#22252a"
accent = "#e0a526"
lens = [24, 34]
