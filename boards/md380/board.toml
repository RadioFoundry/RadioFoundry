	"6b83a74b72df4b13f74f5ac7ef2472593809055fc252c0aabe4c9eeeef1f115c",	# MD-446 D13.20
	"9892b2e95da0eee0ec87604007f157f6f9b249a9fb11ba0fc3798e78956e2587",	# MD-446 D3.20
	"0897e946bb123a5942f1458d3d2be8f759befe769c6aeaad4fe093ad3a40ac01",	# MD-380 D3.32
	"0c954b0fa8426352cf9c99544be4811115f4102fc4ae491269d1cdaef3edd54a",	# RT3 S14.04
]

# How the site draws the radio
[frame]
shape = "handheld"
body = "#1f2124"
accent = "#3d7bd9"
lens = [30, 30]

# The open-firmware CPS radio types qdmr knows the radio by (docs/spec/cps-protocol.md 2.2), as board.c's hal_cps_t
# reports them
[cps]
radio_types = [7]

# The stock codeplug in a backup's SPI flash (tools/backup_codeplug.py): the TYT layout at 0x2000-0x3FFFF, decoded by
# qdmr's md380 driver. It shares the start of the open-firmware image (hardware-md380.md, flash map)
[stock_codeplug]
dmrconf = "md380"
span = [0x2000, 0x40000]
pages = "linear"
