# The MD-380's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and the
# web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in md380.ld.

id = "md380"
name = "TYT MD-380"
maker = "TYT"
model = "MD-380"
also = ["TYT MD-390", "Retevis RT3"]
kind = "handheld"

[docs]
hardware = "docs/spec/hardware-md380.md"
codec = "docs/spec/codec-md380.md"
install = "docs/user/18-moving-from-stock-md380.md"
bringup = "docs/testing/md380-bringup.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
bands = "400-480 MHz or 136-174 MHz (one band per radio)"
power = "1 / 5 W"
display = "color, 160 × 128"
gallery = "160x128"

[status]
level = "testing"
summary = "Fully operational on a UHF radio¹. FM with CTCSS both ways; DMR voice and SMS in simplex and through a repeater or duplex hotspot, on either slot; codeplug and ID database programming (CPS, web editor). The codec comes from the stock D2.32 file ([codec-md380](docs/spec/codec-md380.md)), kept in flash sectors the application never uses, so an update keeps it. Still open: DCS and the tone deviation, the VHF image (untested), FM TX tones and APRS receive ([bring-up checklist](docs/testing/md380-bringup.md))"
release = "testing"

# One band per radio, a build choice (board.mk MD380_BAND). The first value is the default build; ci and the release
# build every other one too. board_name: what the radio reports as board= on the debug link
[[build_options]]
name = "MD380_BAND"
title = "Band"
help = "The MD-380 comes in a UHF and a VHF version; the label under the battery and the frequencies the radio covers tell which."
values = [
	{ id = "uhf", title = "UHF", text = "400-480 MHz", board_name = "MD-380" },
	{ id = "vhf", title = "VHF", text = "136-174 MHz", board_name = "MD-380 VHF" },
]

[flash]
family = "usb-dfu"
keep_codec = true
stock_download = "https://md380.org/firmware/orig/"
stock_versions = ["D002.032"]
backup = { stock = "none", odr = "full", spi_size = 0x1000000 }

[flash.bootloader]
steps = [
	"Turn the radio off and connect the programming cable.",
	"Hold PTT and the side key just above it.",
	"Turn the radio on while you hold both keys. The LED blinks; the screen stays dark.",
	"Release the keys.",
]

# The TYT bootloader takes the same DFU protocol and sector order as the DM-1701's, with its own key
[flash.dfu]
vid = 0x0483
pid = 0xDF11
string1 = "AnyRoad Technology"
product = "Digital Radio in USB mode"
key_sha256 = "5254139c6b596d9413d106e6b7c0685ec245d69555cb28df98f061d6b879c4cd"
key_prefix = "2EDF40B5"

# The codec where the merge puts it (docs/spec/codec-placement.md): the main table window at its stock address in
# sector 8, the small ones in sectors 10 and 11, the code moved to the start of sector 11 and the descriptor. The
# application has sectors 3-7, so an update leaves the codec sectors alone. Stock firmware keeps the code in sectors 6
# and 7, so no stock version leaves it in place and odrflash merges it from the stock file
[codec]
tool = "codec_extract"
stock = "e1a1a11a84d9afd2d2ceed61be8395e32a8034785abd0be0236478f7d8609f43"

# How the site draws the radio
[frame]
shape = "handheld"
body = "#1f2124"
accent = "#3d7bd9"
lens = [30, 30]

# Why each switch in config.mk's BOARD_UNSUPPORTED is n/a on this radio, by feature (tests/hil/features.toml):
# tools/bringup.py shows the reason. "unsupported" instead marks a feature planned but not working yet
[features]
fm_tx_tones = { state = "n/a", reason = "Needs a TX tone path through the HR_C5000 or the PC7 PWM: not written" }
aprs_rx = { state = "n/a", reason = "APRS AFSK needs the TX tone path, which isn't written" }
aprs_igate = { state = "n/a", reason = "Needs APRS receive, which isn't written for this radio" }
sfr = { state = "n/a", reason = "The SFR glue is HR_C6000 only: the HR_C5000 lacks CRC_MCU_Control" }
split_duplex = { state = "n/a", reason = "The split duplex glue is HR_C6000 only" }
font_xl = { state = "n/a", reason = "The 160x128 panel is too small for the large font (it is for 240 px and wider)" }
am_rx = { state = "n/a", reason = "No air band receiver" }
bcast_fm = { state = "n/a", reason = "No broadcast receiver" }
fault_trace = { state = "n/a", reason = "Needs a host UART: the host port is USB, and the one UART is the GPS receive line (G models)" }
