# The AT-D578UV's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and
# the web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in
# boards/d578uv/memory.ld.

id = "d578uv"
name = "AnyTone AT-D578UV"
maker = "AnyTone"
model = "AT-D578UV"
also = ["AnyTone AT-D578UV PRO", "AnyTone AT-D578UV PLUS"]
kind = "mobile"
# where the radio appears in the site's lists (the lowest: the home page's radio)
order = 8

[docs]
hardware = "docs/spec/hardware-d578uv.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
cpu = "GD32F303"
bands = "136-174 / 400-480 MHz"
power = "up to 50 W"
display = "1.77\" color, 160 × 128"
gallery = "160x128"
# a volume knob per side (docs.hardware: side B's is bottom left)
knobs = 2
clock = { rtc = "unknown", note = "the GD32F303 RTC; whether a crystal and a backup supply are fitted is not known (docs/spec/hardware-d578uv.md)" }
# The radio was built with two MCUs (hardware-d578uv.md 1): the radio's version screen names the one it runs on, and
# the vendor update mode answers with a model name per MCU (8). This image runs on the GD32F303 only; the AT32 builds
# take boards/d578uva's
variant_pattern = '(GD|AT)_Ver'
variant_check = "Open the version screen in the radio's menu. GD_Ver is the GD32 build, AT_Ver the AT32 build."

[[hardware.variants]]
code = "GD"
# the USB device the original firmware enumerates as (hardware-d578uv.md 1)
usb_ids = ["28E9:018A"]
name = "GD32F303 (built until mid-2022)"
level = "testing"
notice = "In testing: FM, DMR voice and data, dual watch and GPS work on the radio. Air band AM needs the KTMicro receiver, which some radios don't carry. To go back, write the manufacturer's firmware file through the factory update mode."
runs = { board = "d578uv" }

[[hardware.variants]]
code = "AT"
usb_ids = ["2E3C:5740"]
# kept out of the installers until a first radio has booted it: docs/spec/hardware-d578uv.md 10
blocked = "no AT32 radio has run RadioFoundry yet"
name = "AT32F43x (built from mid-2022)"
level = "bring-up"
notice = "Nothing has run on this radio yet: the AT32 build is written from the AT32 datasheets and the GD32 build's code. To go back, write the manufacturer's firmware file through the factory update mode."
runs = { board = "d578uva" }

[status]
level = "testing"
summary = """\
FM, DMR voice, text messages and positions, dual watch, GPS and the flash stub work on the GD32F303 radios. \
Open: air band AM on a radio with the KTMicro receiver. The AT32 radios can't be installed yet."""
release = "testing"

# The vendor bootloader (0x08000000..0x08005FFF) is never written; the image goes to 0x08006000 through the factory
# update mode (hardware-d578uv.md 8)
[flash]
family = "anytone-update"
keep_codec = false
stock_versions = ["2.08", "PRO 1.21"]
backup = { stock = "none", rfoundry = "none", spi_size = 0 }

# The GD32F30x stub's board record (stub/f4stub.py, stub-gd32f30x.md 5): its board id (HELLO echoes it) and whether it
# has run on a radio. The record's other field, the bootloader's end, is APP_BASE
[flash.stub]
id = 6
tested = true
# The SPI NAND the stub reads as its external memory (pins from pins.h): 2 Gbit, dual SPI reads
spi_nand = { mb = 256, dual = true }

# What no tool erases or writes, as offsets in the program flash. Not the modem boot slot (0xFF000-0x100000): every
# install through the update mode writes it, and the stub writes it only from an image that carries the boot block
[[flash.protect]]
mem = "progmem"
start = 0x0
end = 0x6000
what = "the vendor bootloader and its update mode (hardware-d578uv.md 2, 8)"

# The model names the update mode answers, per variant (hardware-d578uv.md 8): the vendor's .spi files for the 578UV
# (2.08) and the 578UV PRO (1.21), GD32 and AT32 builds
[flash.anytone]
models = { GD = ["D578UV2", "D578UV"], AT = ["578UV2A", "D578UVA"] }

[flash.bootloader]
hold = ["menu", "exit"]
steps = [
	"Turn the radio off and connect the USB programming cable.",
	"Hold MENU and EXIT and turn the radio on.",
	"Release the keys when the update screen shows.",
]

# How the site draws the radio
[frame]
shape = "mobile"
body = "#1d1e21"
accent = "#d0a020"
lens = [20, 20]

# The DMR baseband's boot block (hardware-d578uv.md 4.3), merged from the user's stock file into the modem boot slot
# (boards/d578uv/memory.ld __codec_slot)
[codec]
tool = "modem_boot"
profile = "d578uv-boot"
sources = ["AT-D578UV stock firmware (.CDD), any build", "a program flash read of the radio"]

[hil.limits]
beep_lead_pops = { value = 1, reason = "the speaker amplifier pops as PA7 turns it on, in the beep's silent lead, 20-25 dB over the room; the level device's setting and the gate's order don't change it, and the hang keeps a run of beeps to one; hardware-d578uv.md 4.4" }
beep_dropouts = { value = 1, reason = "the TX-deny beep's 300 Hz tone drops 20 dB for a few ms now and then, by microphone; a known issue" }
dmr_tx_ramp_ms = { value = 1.75, reason = "the PA's key-down ramp measures 1.58-1.69 ms on the SDR bench: over the 1.5 ms of the ETSI power mask; the baseband's manuals offer no ramp setting; hardware-d578uv.md 5.1" }
