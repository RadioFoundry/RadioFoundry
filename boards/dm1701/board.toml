	"0a23d563fba04a1874c1e4eb4c0c23bf86e1d17da37cd3681f06ea71ad9c800a",	# V02.03 noCSV
	"de368437de05307d3e217f049bb5e30b1a8ec201e50b8e81aa5c506089c53532",	# MD-9600 V16.45 CSV
