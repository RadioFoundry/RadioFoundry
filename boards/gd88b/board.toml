# The GD-88's SoC B (tools/boards.py): the radio's second receiver, a firmware of its own that the GD-88 (boards/gd88)
# flashes through SoC A's bridge. It is part of that radio, not a radio of its own: the site and the generated
# tables list only the GD-88. Build facts stay in board.mk and config.mk, the memory layout in boards/gd88b/memory.ld.

id = "gd88b"
name = "Radioddity GD-88 (second receiver)"
maker = "Radioddity"
model = "GD-88 receiver B"
also = []
kind = "handheld"
order = 8
part_of = "gd88"

[docs]
hardware = "docs/spec/hardware-gd88.md"
bringup = "docs/testing/gd88-bringup.md"

[hardware]
cpu = "HR_C7000"
bands = "136-174 / 400-480 MHz"
power = "receive only"
display = "none (SoC A's)"
gallery = "320x240"
clock = { rtc = "none", note = "SoC B keeps no time: the clock is SoC A's (docs/spec/hardware-gd88.md 10)" }

[status]
level = "bring-up"
summary = "Written from the hardware notes: analog FM and DMR receive for SoC A's dual watch. Open: a first run on the radio."
release = "testing"

[flash]
family = "serial-iap"
keep_codec = false
stock_versions = []
backup = { stock = "full", rfoundry = "full", spi_size = 0 }

# Flash no tool erases or writes (docs/dev/board-registry.md, "Protected regions"): mem, start and end (exclusive)
# as offsets in that memory, what with the spec section that establishes it. The NAND entries follow the stock block
# map (docs/spec/spi-nand-lut.md), read on the bench's A
[[flash.protect]]
mem = "progmem"
start = 0x1FD000
end = 0x1FF000
what = "SoC B: the display record and the factory calibration's program flash copy (hardware-gd88.md 7)"

[[flash.protect]]
mem = "nand"
start = 0x0
end = 0x20000
what = "SoC B: the stock block map (LUT0) in physical block 0 (hardware-gd88.md 7, spi-nand-lut.md)"

[[flash.protect]]
mem = "nand"
start = 0x280000
end = 0x380000
what = "SoC B: factory calibration, the NAND copy (logical 0x280000): physical block 20 plus one block up for each unusable block below it; up to 7 covered, as the web flasher's search (hardware-gd88.md 7: block 21 on the bench's A)"

[[flash.protect]]
mem = "nand"
start = 0xF9C0000
end = 0x10000000
what = "SoC B: the stock firmware's spare pool, the top 10 usable blocks: blocks 1998-2047 hold them with up to 40 unusable blocks (hardware-gd88.md 7, spi-nand-lut.md)"

[flash.bootloader]
steps = [
	"Turn the radio off and connect the programming cable.",
	"Hold SK1 and turn the radio on with the volume knob. When the LED lights red and the top line shows IAP_A or IAP_B, release SK1. It can take more than one try.",
	"If the top line shows IAP_A, hold SK1 until it shows IAP_B.",
]

# The universal stub's board profile: no power latch (A holds the power), its status LEDs (pins.h PIN_LED1, PIN_LED2),
# UART 0x14090000 before CONFIG (the link to A), reached through A's bridge. B has its own SPI NAND, which holds its
# own calibration page; calibration: its two copies (hardware-gd88.md 7, 10)
[flash.stub]
id = 5
hold_power = false
progmem = 0x200000
tested = false
leds = ["PIN_LED1", "PIN_LED2"]
uart = 0x14090000
bridge = true
calibration = { progmem = 0x1FE000, nand = 0x280000, magic = "TUNE" }

# The codec slot and windows come from boards/gd88b/memory.ld. B runs A's codec, packed as on A (from): the user gives
# only A's file, or the web flasher reuses A's slot; B's own files still work (hardware-gd88.md 8)
[codec]
tool = "hrc7000_codec"
profile = "gd88b-2501"
from = ["gd88"]
stock_version = "B49E.D64.EOPSAB.021 (2025-01-19)"
sources = ["GD-88 A B49E.D64.EOPSAB.013 to .021 update files (the A file, as for SoC A)", "a program flash read of SoC A",
	"GD-88 B B49C.D64.EHRNAB.005 to .012 update files"]

[frame]
shape = "handheld"
body = "#17181a"
accent = "#e8761e"
lens = [20, 20]
