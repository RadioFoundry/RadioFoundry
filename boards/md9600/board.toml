# The MD-9600's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and the
# web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in memory.ld.

id = "md9600"
name = "TYT MD-9600"
maker = "TYT"
model = "MD-9600"
also = ["Retevis RT90"]
kind = "mobile"
debuglink_aliases = ["MD9600", "RT90"]
# where the radio appears in the site's lists (the lowest: the home page's radio)
order = 6

[docs]
hardware = "docs/spec/hardware-md9600.md"
codec = "docs/spec/codec-md9600.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
bands = "136-174 / 400-480 MHz"
power = "up to 50 W"
display = "monochrome, 128 × 64"
gallery = "128x64"
clock = { rtc = "unknown", note = "STM32 RTC on a 32.768 kHz crystal; the backup domain is only known to hold while DC is applied, VBAT unverified (docs/spec/hardware-md9600.md 1.3, 1.4)" }

[status]
level = "bring-up"
summary = """\
Builds for every board revision (SKY72310, "PLL1590" and LMX2571 synthesizers) and is offered to testers through the \
bootloader and the flash stub. Open: everything on a radio; nothing has run on an MD-9600 yet, and transmit is off."""
release = "testing"

# This board's own switches (config.mk, config_md9600.h) aren't feature switches, so ci's per-switch builds don't cover
# them: the transmit paths built in, and a single-revision image
[ci]
extra = [
	{ name = "tx", make = ["CONFIG_MD9600_TX=y", "CONFIG_MD9600_DMR_TX=y"] },
	{ name = "v5-only", make = ["CONFIG_MD9600_V1V3=n", "CONFIG_MD9600_V4=n"] },
]

[flash]
family = "usb-dfu"
keep_codec = true
stock_versions = ["V06.09 CSV (boards V1-V3)", "V16.45 CSV (V4 boards)"]
backup = { stock = "none", rfoundry = "full", spi_size = 0x1000000 }

[flash.bootloader]
steps = [
	"Disconnect the radio's DC power cable (the power key alone is not enough) and connect the USB cable to the mini-USB port on the rear.",
	"Hold P1 and the orange (alarm) key while you connect the power again. The display flashes, then stays blank. Not yet confirmed on a radio: one report names the red key instead of the orange one.",
	"Release the keys.",
]

# The STM32F4 flash stub's board record (docs/spec/stub-stm32f4.md 5.2): the data flash on SPI2 in mode 3, its pins in
# pins.h, the LCD's chip select held high so the panel ignores the bus. Not run on a radio yet
[flash.stub]
id = 3
tested = false
spi = { bus = 2, mode = 3, hz = 4500000 }
idle_cs = ["PIN_LCD_CS"]

# The TYT bootloader takes the same DFU protocol and sector order as the other usb-dfu radios, with its own key
# (docs/spec/hardware-md9600.md 14.2)
[flash.dfu]
vid = 0x0483
pid = 0xDF11
string1 = "AnyRoad Technology"
product = "Digital Radio in USB mode"
key_sha256 = "c3d665b297651b52310ec098e87440b147136241359c1154d474e517b048c9ae"
key_prefix = "A2FABB4B"

# The codec where the merge puts it (docs/spec/codec-md9600.md "Hosting"): the tables stay in sector 9 at the stock
# build's address, the code moves to the start of sector 11 and the descriptor to its end. The application has sectors
# 3-7, so an update leaves the codec sectors alone. The 06.09 and 16.45 builds keep their tables at different addresses
# and report the one codec id: a merge uses the windows of the file it merges, and the board's windows are both files'
[codec]
tool = "codec_extract"
stock = [
	"79a561eda2f5843334ea5974f5de511b6e172a1643f9163806d54a94404f0f09",	# MD9600-CSV-V06.09.bin
	"de368437de05307d3e217f049bb5e30b1a8ec201e50b8e81aa5c506089c53532",	# MD9600-CSV(V4)-V16.45.bin
]

# How the site draws the radio
[frame]
shape = "mobile"
body = "#1d1f22"
accent = "#e07a26"
lens = [22, 22]

# What the health checks expect (tests/hil/test_health.py): the supply range is a vehicle's 13.8 V system with margin
# (the divider's scale is unverified, hardware-md9600.md 10.3). The data flash's JEDEC ID and the calibration lines
# aren't here: no radio has confirmed the part, and the calibration is read by the board's own HIL test
# (boards/md9600/hil)
[hil]
display = "128x64x1"
features = ["USB", "DEBUGLINK", "CPS_OPENFW"]
supply_mv = [10000, 16000]

# The open-firmware CPS radio types qdmr knows the radio by (docs/spec/cps-protocol.md 2.2), as board.c's hal_cps_t
# reports them
[cps]
radio_types = [5]
