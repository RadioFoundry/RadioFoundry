# The MD-9600's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and the
# web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in memory.ld.

id = "md9600"
name = "TYT MD-9600"
maker = "TYT"
model = "MD-9600"
also = ["Retevis RT90"]
kind = "mobile"
debuglink_aliases = ["MD9600", "RT90"]
# where the radio appears in the site's lists (the lowest: the home page's radio)
order = 7

[docs]
hardware = "docs/spec/hardware-md9600.md"
codec = "docs/spec/codec-md9600.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
bands = "136-174 / 400-480 MHz"
power = "up to 50 W"
display = "monochrome, 128 × 64"
gallery = "128x64"
clock = { rtc = "unknown", note = "STM32 RTC on a 32.768 kHz crystal; the backup domain is only known to hold while DC is applied, VBAT unverified (docs/spec/hardware-md9600.md 1.3, 1.4)" }

[status]
level = "testing"
summary = """\
One image serves every board revision. On a V1-V3 radio, the display, keys and encoder, debug link, programming, FM and \
DMR receive on both bands with CTCSS / DCS, and transmit on both bands (FM and DMR; the MMDVM hotspot on UHF) work, with \
every power level checked on a wattmeter on both bands. Transmit is armed per power cycle. Open: V4 and V4A/V5 boards \
have not run on a radio, and SFR loses inbound voice frames."""
release = "stable"

# This board's own switches (config.mk, config_md9600.h) aren't feature switches, so ci's per-switch builds don't cover
# them: a receive-only image, and a single-revision image
[ci]
extra = [
	{ name = "no-tx", make = ["CONFIG_MD9600_TX=n", "CONFIG_MD9600_DMR_TX=n"] },
	{ name = "v5-only", make = ["CONFIG_MD9600_V1V3=n", "CONFIG_MD9600_V4=n"] },
]

[flash]
family = "usb-dfu"
keep_codec = true
notice = "One image serves every MD-9600, but only V1-V3 boards (original firmware V06.xx) have run RadioFoundry so far. V4 (V16.xx) and V4A/V5 (V26.xx) boards have not been tried on a radio: receive or transmit may not work. Transmit stays off until you turn it on in Settings > Advanced > Hardware. Keep a backup so you can go back to the original firmware, and please report what you find."
stock_versions = [
	"03.28 to 06.24 (V1-V3 boards)", "16.24 and 16.45 (V4 boards)", "26.38 to 26.45 (V5 boards)", "26.57 (V4A boards)",
]
backup = { stock = "none", rfoundry = "full", spi_size = 0x1000000 }

[flash.bootloader]
steps = [
	"Disconnect the radio's DC power cable (the power key alone is not enough) and connect the USB cable to the mini-USB port on the rear.",
	"Hold P1 and the orange (alarm) key while you connect the power again. The screen stays blank and the backlight blinks once a second.",
	"Release the keys.",
]

# The STM32F4 flash stub's board record (docs/spec/stub-stm32f4.md 5.2): the data flash on SPI2 in mode 3, its pins in
# pins.h, the LCD's chip select held high so the panel ignores the bus. Writes checked on a V1-V3 radio (2026-11-05)
[flash.stub]
id = 3
tested = true
spi = { bus = 2, mode = 3, hz = 4500000 }
idle_cs = ["PIN_LCD_CS"]

# The TYT bootloader takes the same DFU protocol and sector order as the other usb-dfu radios, with its own key
# (docs/spec/hardware-md9600.md 14.2)
[flash.dfu]
vid = 0x0483
pid = 0xDF11
string1 = "AnyRoad Technology"
product = "Digital Radio in USB mode"
key_sha256 = "c3d665b297651b52310ec098e87440b147136241359c1154d474e517b048c9ae"
key_prefix = "A2FABB4B"
# the bootloader's alt 0 string (seen on a radio, hardware-md9600.md 15): the flashers accept no other DFU layout
layout = "@Internal Flash   /0x0800C000/01*016Kg,01*064Kg,07*128Kg"

# The board revision, which RadioFoundry can't detect (docs/spec/hardware-md9600.md 16), follows the major version of
# the radio's original firmware. The installers read that version over USB before the install and store the
# revision as the board record once RadioFoundry runs (hardware-md9600.md 15.1, 19.3)
[flash.original_version]
read = "dfu-info"
# the original firmware's first DFU interface string; the bootloader's is "@Internal Flash   /0x0800C000/..."
interface = "@Internal Flash   /0x08000000/03*016Kg"
hwopt = "Board revision"
major = { "06" = "V1-V3", "16" = "V4", "26" = "V4A/V5" }

# What the web flasher backs up before the install, from the original firmware running normally or from the bootloader
# (hardware-md9600.md 15.2): the info blocks (A2 ss), one snapshot of the internal flash from 0x08000000 before program
# mode, then the SPI flash in program mode: all of it from the original firmware, the first 1 MB from the bootloader.
# quick: the codeplug areas only
[flash.original_backup]
info = ["02", "01", "03", "04", "05", "07", "08", "32", "33", "50"]
mirror = 0xFFFF
spi = 0x1000000
quick = 0x200000
loader_interface = "@Internal Flash   /0x0800C000/01*016Kg,01*064Kg,07*128Kg"
loader_spi = 0x100000

# The codec where the merge puts it (docs/spec/codec-md9600.md "Hosting"): the tables stay at the stock build's address in
# sector 9 (the largest GPS-REC builds' run a few hundred bytes into sector 10, which is free), the code moves to the
# start of sector 11 and the descriptor to its end. The application has sectors 3-8, so an update leaves the codec
# sectors alone. The builds keep their tables at different addresses and report the one codec id: a merge uses the
# windows of the file it merges, and the board's windows are all the files' (sectors 9-11). Each line is one original
# firmware file: 03.28 to 06.24 (06.09 is the V1-V3 boards' file), 16.xx for V4, 26.38 to 26.45 for V5 (the RT90's are 26.38, 26.41 and
# 26.42) and 26.57 for V4A, in the CSV, CSV-GPS, REC and GPS-REC variants that exist
