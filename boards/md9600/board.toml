# How the site draws the radio
[frame]
shape = "mobile"
body = "#1d1f22"
accent = "#e07a26"
lens = [22, 22]

# What the health checks expect (tests/hil/test_health.py): the supply range is a vehicle's 13.8 V system with margin
# (the divider's scale is unverified, hardware-md9600.md 10.3). The data flash's JEDEC ID and the calibration lines
# aren't here: no radio has confirmed the part, and the calibration is read by the board's own HIL test
# (boards/md9600/hil)
[hil]
display = "128x64x1"
features = ["USB", "DEBUGLINK", "CPS_FAST"]	# CPS_FAST needs CPS_OPENFW, which the feature string doesn't list
supply_mv = [10000, 16000]

# Features built and known not to work yet on this radio (tools/bringup.py: "unsupported"), each with its reason
[features]
sfr = { state = "unsupported", reason = "test_sfr_repeater_quality loses 24 inbound frames of a bench call (3 allowed) on the radio's single receive path; parked until that is looked into" }

# The open-firmware CPS radio types qdmr knows the radio by (docs/spec/cps-protocol.md 2.2), as board.c's hal_cps_t
# reports them
[cps]
radio_types = [5]
