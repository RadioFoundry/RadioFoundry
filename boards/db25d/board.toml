# The DB25-D PRO's registry entry (tools/boards.py, docs/dev/adding-a-radio.md): everything the tools, CI, the docs and
# the web site know about this radio. Build facts stay in board.mk and config.mk, the memory layout in db25d.ld and
# db25d_dmr.ld.

id = "db25d"
name = "Radioddity DB25-D PRO"
maker = "Radioddity"
model = "DB25-D PRO"
also = ["Kydera CDR-300UV"]
kind = "mobile"
# Older VERSION board= values that also mean this radio (debug link). The current one is board_t .name (or a
# build option value's board_name), and the id always counts
debuglink_aliases = ["DB25-D PRO"]

[docs]
hardware = "docs/spec/hardware-db25d.md"

# One-line summaries for the site and the generated tables; the facts are in docs.hardware
[hardware]
bands = "136-174 / 400-480 MHz"
power = "up to 25 W"
display = "1.77\" color, 160 × 128"
gallery = "160x128"

[status]
level = "bring-up"
summary = "Bring-up on a radio: FM receive and transmit, display, keys, host link, settings storage, the open-firmware CPS and volume work. DMR voice receive and transmit checked on the SDR bench; the hotspot, the DMR VFO and the PPP network services work on the radio ([hardware-db25d](docs/spec/hardware-db25d.md) 9). The older DB25-D batches (FD6818) and the Retevis RT73 aren't covered yet"
release = "testing"

# The vendor IAP loader (0x03000000..0x0300BFFF) is never written. ODR's first stage fills the sector at 0x0300C000
# (board.mk BOOT_*), the application follows it, the codec slot is the DM-32UV's (db25d_dmr.ld). The web flasher (IAP
# loader, or the stub from ODR) and stub/stubtool.py flash it
[flash]
family = "serial-iap"
keep_codec = false
stock_versions = []
backup = { stock = "full", odr = "full", spi_size = 0 }

[flash.bootloader]
steps = [
	"Turn the radio off and connect the programming cable.",
	"Hold P1 and press power. The red LED lights and the display stays blank.",
]

# The universal HR_C7000 stub's board profile (CONFIG, stub/stubtool.py): the stub holds the power latch (pins.h:
# PTB13 latch, PTB12 power key, hardware-db25d.md 3.3, the same pins under ODR, its first stage and the stock firmware);
# 2 MB of program flash (Boya, JEDEC 68 40 15).
# stock_console: the stock firmware answers a debug console the web flasher reads before ODR is installed
[flash.stub]
id = 3
hold_power = true
progmem = 0x200000
tested = false
stock_console = true

# The codec slot and windows come from db25d_dmr.ld (__codec_*, the script CONFIG_DMR selects)
[codec]
tool = "hrc7000_codec"
profile = "db25d-018"
sources = ["DB25-D PRO 909E.Dx.EARSAB.018 stock files", "a program flash read of the radio"]

# How the site draws the radio
[frame]
shape = "mobile"
body = "#202226"
accent = "#c8372d"
lens = [20, 20]

# The open-firmware CPS radio types qdmr knows the radio by (docs/spec/cps-protocol.md 2.2), as board.c's hal_cps_t
# reports them (6, the shim's default)
[cps]
radio_types = [6]

# Why each switch in config.mk's BOARD_UNSUPPORTED is n/a on this radio, by feature (tests/hil/features.toml):
# tools/bringup.py shows the reason. "unsupported" instead marks a feature planned but not working yet
[features]
usb = { state = "n/a", reason = "No USB data port: the host link runs on the programming cable's UART" }
usb_network = { state = "n/a", reason = "No USB data port for the network adapter: PPP on the host UART stands in" }
net_usrp = { state = "n/a", reason = "USRP's 8 kHz PCM both ways needs more than the 115200 baud host port carries" }
split_duplex = { state = "n/a", reason = "The split-duplex roles need a continuous base-station outbound that the per-burst TX path lacks" }
sfr = { state = "n/a", reason = "Switches RX and TX every slot, which the per-burst retune hasn't been timed for" }
aprs_rx = { state = "n/a", reason = "The radio doesn't give the core its FM receive audio as PCM (the PCM path is the DMR modem's)" }
aprs_igate = { state = "n/a", reason = "Needs APRS receive, which needs the FM receive audio as PCM" }
bcast_fm = { state = "n/a", reason = "The RDA5802N broadcast receiver isn't wired yet" }
am_rx = { state = "n/a", reason = "The air band isn't wired yet" }
audio_probe = { state = "n/a", reason = "A bench diagnostic the radio's audio path doesn't have" }
font_xl = { state = "n/a", reason = "The 160x128 panel is too small for the large font (it is for 240 px and wider)" }
