# rfoundry as a Python package: pipx install ./tools/rfoundry (or a git URL with #subdirectory=tools/rfoundry).
# The release workflow also builds single-file executables from it with PyInstaller (docs/dev/release.md).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rfoundry"
dynamic = ["version"]
description = "Flash RadioFoundry firmware, keeping or merging the radio's own AMBE codec"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
	"pyusb>=1.2.1",
	"libusb-package>=1.0.26.1",
	"pyserial>=3.5",
	"certifi",
]

[project.scripts]
rfoundry = "rfoundry.cli:main"

[tool.setuptools]
packages = ["rfoundry"]

# the codec maps (docs/spec/codec-placement.md): addresses and offsets only, no codec bytes; the board registry
# (registry.json, generated by tools/boards.py)
[tool.setuptools.package-data]
rfoundry = ["codec_maps/*/*.json", "registry.json"]

[tool.setuptools.dynamic]
version = { attr = "rfoundry.__version__" }
