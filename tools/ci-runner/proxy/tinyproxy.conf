# Only the runner's internal network reaches this port (it isn't published on the host).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Connect
DisableViaHeader Yes
# CONNECT (HTTPS) only to port 443, and every request only to a host in `allow` (extended regular expressions,
# matched against the host name; anything not listed is refused)
ConnectPort 443
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allow"
