<head>
	<meta charset="utf-8">

	<title>Theme Pack Uploader</title>
	<link rel="stylesheet" href="../../site/static/css/tokens.css">
	<link rel="stylesheet" href="../../site/static/css/site.css">

<body>
<header class="theme-tools-header">
	<div class="wrap theme-tools-header-inner">
		<a class="theme-tools-title" href="../../tools/theme_pack_builder.html">Theme Tools</a>
		<nav class="theme-tools-nav" aria-label="Theme tools">
			<a href="uploader.html">Uploader</a>
			<a href="../../tools/theme_pack_builder.html">Builder</a>
		</nav>
	</div>
</header>
<main class="wrap section">
	<h1>Theme Pack Uploader</h1>
	<p class="lead">Install a theme pack separately from firmware. After installation, restart the radio and choose a theme in Settings &gt; Display.</p>
	<p><label class="btn tle-browse">Choose a .rftheme file <input type="file" id="theme-pack-file" accept=".rftheme,application/octet-stream"></label></p>
	<p>
		<button class="btn" type="button" id="theme-pack-install" disabled>Install theme pack</button>
		<button class="btn btn-secondary" type="button" id="theme-pack-remove">Remove installed pack</button>
	</p>
	<p id="theme-pack-status" class="small muted" role="status" aria-live="polite">Choose a compiled .rftheme file.</p>
	<p>Installing or removing a pack updates only the dedicated theme-pack storage area.</p>
</main>
