<section class="wrap section page-head">
	<h1>{{t screens.title}}</h1>
	<p class="lead">{{t screens.lead}}</p>
</section>
<section class="wrap section screens-page" data-screens>
	<div class="screens-bar">
		<nav class="radio-pick" aria-label="{{t screens.pick}}">{{{ picks }}}</nav>
		<label class="variants-toggle small"><input type="checkbox" id="show-variants"> {{t screens.variants}}</label>
	</div>
	<div class="rshots-all">{{{ sections }}}</div>
</section>
