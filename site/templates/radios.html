<section class="wrap section page-head">
	<h1>{{t radios.title}}</h1>
	<p class="lead">{{t radios.lead}}</p>
</section>
<section class="wrap section">
	<div class="cards">{{{ cards }}}</div>
</section>
<section class="wrap section">
	<h2>{{t radios.list_title}}</h2>
	<p class="muted">{{t radios.list_lead}}</p>
	<div class="table-wrap">
		<table class="data radio-list">
			<thead><tr><th scope="col">{{t radios.col_radio}}</th><th scope="col">{{t radios.col_status}}</th><th scope="col">{{t radios.col_cpu}}</th><th scope="col">{{t radios.col_display}}</th><th scope="col">{{t radios.col_notes}}</th></tr></thead>
			<tbody>{{{ rows }}}</tbody>
		</table>
	</div>
</section>
