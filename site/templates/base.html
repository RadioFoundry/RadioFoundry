<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · RadioFoundry</title>
<meta name="description" content="{{ description }}">
<meta name="generator" content="site/build.py {{ git }}">
<link rel="icon" href="{{root}}static/img/icon.svg?v={{ assets }}" type="image/svg+xml">
<link rel="icon" href="{{root}}static/img/icon-32.png?v={{ assets }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}static/img/apple-touch-icon.png?v={{ assets }}">
<link rel="stylesheet" href="{{root}}static/css/tokens.css?v={{ assets }}">
<link rel="stylesheet" href="{{root}}static/css/site.css?v={{ assets }}">
<script>try{var t=localStorage.getItem("rfoundry-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="page-{{ page_class }}" data-root="{{root}}" data-home="{{ home }}">
<a class="skip" href="#main">{{t nav.skip}}</a>
<header class="site-header">
	<div class="wrap header-row">
		<a class="brand" href="{{ home }}index.html">
			<img src="{{root}}static/img/icon.svg?v={{ assets }}" alt="" width="28" height="28">
			<span>Radio<b>Foundry</b></span>
		</a>
		<button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">{{t nav.menu}}</button>
		<nav id="site-nav" class="site-nav" aria-label="{{t nav.label}}">{{{ nav }}}</nav>
		<div class="header-tools">
			<span class="lang-switch">{{{ languages }}}</span>
			<button class="theme-toggle" type="button" aria-label="{{t nav.theme}}" title="{{t nav.theme}}">◐</button>
		</div>
	</div>
</header>
<main id="main">
{{{ content }}}
</main>
<footer class="site-footer">
	{{{ footer }}}
	<div class="wrap footer-row">
		<p>{{t footer.license}} · <a href="{{ repo }}">{{t footer.source}}</a> · <a href="{{ home }}docs/index.html">{{t nav.docs}}</a></p>
		<p class="build-stamp"><a href="{{ repo }}/commit/{{ git_full }}">{{ git_stamp }}</a> · <time datetime="{{ built_iso }}">{{ built_at }}</time></p>
	</div>
</footer>
<script type="module" src="{{root}}static/js/site.js?v={{ assets }}"></script>
{{{ scripts }}}
</body>
</html>
