<section class="wrap section page-head">
	<h1>{{t flash.title}}</h1>
	<p class="lead">{{t flash.lead}}</p>
</section>
<section class="wrap section">
	<noscript><p class="notice">{{t flash.noscript}}</p></noscript>
	<div id="flasher" class="flasher" aria-live="polite">
		<p class="muted">{{t flash.loading}}</p>
	</div>
	<div class="flash-log small">
		<p>{{t flash.log.summary}} <a id="flash-log-off" href="?reporting=0">{{t flash.log.off}}</a></p>
		<details>
			<summary>{{t flash.log.more}}</summary>
			<p>{{t flash.log.sent}}</p>
			<p>{{t flash.log.kept}}</p>
			<p>{{t flash.log.choices}}</p>
		</details>
	</div>
</section>
