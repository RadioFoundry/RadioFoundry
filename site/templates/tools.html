<section class="wrap section page-head">
	<h1>{{t tools.title}}</h1>
	<p class="lead">{{t tools.lead}}</p>
</section>
<section class="wrap section">
	<div class="cards tools">
		<article class="card tool" id="convert">
			<h2>{{t tools.convert_title}}</h2>
			<p>{{t tools.convert_text}}</p>
			<label class="drop"><input type="file" id="convert-file"><span>{{t tools.convert_drop}}</span></label>
			<div id="convert-result" aria-live="polite"></div>
		</article>
		<article class="card tool">
			<h2>{{t tools.contacts_title}} <span class="badge badge-planned">{{t status.planned}}</span></h2>
			<p>{{t tools.contacts_text}}</p>
		</article>
		<article class="card tool">
			<h2><a href="{{home}}codeplug/index.html">{{t tools.editor_title}}</a></h2>
			<p>{{t tools.editor_text}}</p>
		</article>
	</div>
</section>
