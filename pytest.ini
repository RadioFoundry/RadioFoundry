# Anchors pytest's rootdir (and its .pytest_cache) at the repository. Without a config file pytest roots a run at the
# common ancestor of every existing path on its command line, option values included, so
# `--radio-port /dev/cu.usbmodem2101` or `--shots /tmp/shots` puts the rootdir at / and the cache write fails.
[pytest]
