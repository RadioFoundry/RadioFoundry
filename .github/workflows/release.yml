# Copyright (c) 2026 The OpenDigitalRadio Authors
#
# Firmware releases (docs/dev/release.md): on a v* tag, build the codec-less firmware for every releasable radio
# (board.toml [status] release = "stable", each build option value's image too) with the toolchains platform.toml
# pins, one job per platform, write a manifest and SHA256SUMS for each image, build odrflash as single-file
# executables for Linux, macOS and Windows, and attach everything to the GitHub release (created when missing; the user manual
# workflow attaches its PDF to the same release). The AMBE codec is never part of any of it.
#
# Pull requests touching the release tooling build everything as workflow artifacts and publish nothing; the release
# gate (tools/ci.sh) runs for a tag only, since a pull request's own checks already ran it. With the repository
# variable ODR_CI_RUNNER set, the Linux jobs run on that self-hosted runner, and only a v* tag also builds odrflash on
# GitHub's macOS and Windows runners (docs/dev/ci.md).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "tools/odrflash/**"
      - "tools/release.py"
      - "tools/serial_loader.py"
      - "tools/hrc7000_codec.py"
      - "tools/boards.py"
      - "tools/registry_docs.py"
      - "tools/odr_python.sh"
      - "tools/platform_toolchain.sh"
      - "tools/install-arm-toolchain.sh"
      - "tools/build-csky-toolchain.sh"
      - "boards/*/board.toml"
      - "boards/*/board.mk"
      - "platform/*/platform.toml"
      - "stub/stubtool.py"
      - ".github/actions/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.11.1"
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      odrflash: ${{ steps.v.outputs.odrflash }}
    steps:
      - id: v
        env:
          # never for a fork's pull request: its code stays on GitHub's runners
          RUNNER_LABEL: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ODR_CI_RUNNER) || '' }}
        run: |
          # odrflash's runners: all four for a release or without the self-hosted runner; otherwise Linux only, there
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ -z "$RUNNER_LABEL" ]; then
            m='[{"os":"ubuntu-22.04","name":"linux-x86_64"},{"os":"macos-14","name":"macos-arm64"},'
            m="$m"'{"os":"macos-15-intel","name":"macos-x86_64"},{"os":"windows-2022","name":"windows-x86_64","ext":".exe"}]'
          else
            m="[{\"os\":\"$RUNNER_LABEL\",\"name\":\"linux-x86_64\"}]"
          fi
          echo "odrflash=$m" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "${GITHUB_REF_NAME}" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    # one job per platform: every releasable board on it (board.toml [status] release = "stable") and each of its build
    # option values' images (one per band, for example), all from the registry, so a new radio is released with no edit
    # here. One artifact per platform
    name: firmware (${{ matrix.platform }})
    needs: version
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # platform/*/platform.toml; a new platform also gets its set-up in .github/actions/toolchain
        platform: [stm32f4, hrc7000]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
          fetch-depth: 0
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      # the pinned compiler on the runner, never the CI image: the self-hosted image's, or installed (Arm) or built from
      # source (csky-elf, about 45 minutes the first time; the cache keeps it)
      - name: Toolchain (platform.toml [toolchain])
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ matrix.platform }}
          build-from-source: "true"

      - name: Release gate (host tests, Python checks, the platform's builds, license checks)
        if: needs.version.outputs.publish == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tools/ci.sh --quick --platform "$PLATFORM"

      - name: Build and package every releasable board
        id: pkg
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          PY=$(tools/odr_python.sh)   # the registry reads TOML: Python 3.11 or later
          boards=$("$PY" tools/boards.py list --platform "$PLATFORM" --release stable --comma)
          echo "boards=$boards" >> "$GITHUB_OUTPUT"
          [ -n "$boards" ] || { echo "::notice::no releasable board on $PLATFORM"; exit 0; }
          for b in $(echo "$boards" | tr , ' '); do
            # the default image, then each build option value's ("name VAR=value...", tools/boards.py builds)
            { echo default; "$PY" tools/boards.py builds "$b"; } > "$RUNNER_TEMP/builds"
            while read -r name args <&3; do
              opts=""
              for a in $args; do opts="$opts --build-option $a"; done
              echo "== $b $name"
              # shellcheck disable=SC2086
              make BOARD="$b" $args -j"$(nproc)"
              # shellcheck disable=SC2086
              python3 tools/release.py --board "$b" $opts --version "$VERSION" --out dist
            done 3< "$RUNNER_TEMP/builds"
          done

      - uses: actions/upload-artifact@v4
        if: steps.pkg.outputs.boards != ''
        with:
          name: firmware-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  odrflash:
    needs: version
    strategy:
      fail-fast: false
      # from the version job: ubuntu-22.04 (the oldest glibc we build on, so the binary runs on older distributions),
      # macos-14, macos-15-intel (macos-13 is retired; the last Intel image) and windows-2022, or the self-hosted
      # runner alone
      matrix:
        include: ${{ fromJSON(needs.version.outputs.odrflash) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        if: runner.environment != 'self-hosted'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python venv (the self-hosted image's Python 3.12; its system Python takes no pip installs)
        if: runner.environment == 'self-hosted'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==${PYINSTALLER_VERSION}" ./tools/odrflash
      - name: Test
        run: python -W ignore -m unittest discover -s tools/odrflash/tests -v
      - name: Build the executable
        run: |
          set -eu
          out="odrflash-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          # the serial route (odrflash/serialflash.py) imports these tools from the checkout; bundle them
          pyinstaller --onefile --clean --name "$out" --paths tools/odrflash --paths tools --paths stub \
            --hidden-import serial_loader --hidden-import hrc7000_codec --hidden-import stubtool \
            --collect-binaries libusb_package --collect-data certifi --hidden-import usb.backend.libusb1 \
            --add-data "tools/odrflash/odrflash/codec_maps:odrflash/codec_maps" \
            --add-data "tools/odrflash/odrflash/registry.json:odrflash" \
            tools/odrflash/odrflash/__main__.py
          "./dist/$out${{ matrix.ext }}" --version
          "./dist/$out${{ matrix.ext }}" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: odrflash-${{ matrix.name }}
          path: dist/odrflash-*
          if-no-files-found: error

  publish:
    needs: [version, firmware, odrflash]
    if: needs.version.outputs.publish == 'true'   # and every platform's firmware and every odrflash passed
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files and one SHA256SUMS
        run: |
          set -eu
          mkdir -p out
          find artifacts -type f ! -name SHA256SUMS -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # the manifests' own image hashes must agree with the files
          for j in out/odr-*.json; do
            python3 - "$j" <<'EOF'
          import hashlib, json, os, sys
          m = json.load(open(sys.argv[1]))
          img = os.path.join(os.path.dirname(sys.argv[1]), m["image"]["file"])
          assert hashlib.sha256(open(img, "rb").read()).hexdigest() == m["image"]["sha256"], img
          assert m["codec"]["included"] is False, "a release image must never include the codec"
          print("manifest ok:", sys.argv[1])
          EOF
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          NOTES="Firmware images for the radios listed below, without the AMBE codec, and odrflash for Linux, macOS and
          Windows. Flash with: odrflash flash --release ${TAG}. odrflash keeps the codec already in your radio when
          that is known to be safe, or writes it from your radio's stock firmware file (--stock). See
          docs/user/02-installing.md."
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "OpenDigitalRadio $TAG" --notes "$NOTES" || \
            gh release view "$TAG" > /dev/null   # created meanwhile by the manual workflow
          gh release upload "$TAG" out/* --clobber
