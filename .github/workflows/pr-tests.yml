#
# CI on every pull request (docs/dev/ci.md "Pull request checks"). The jobs are ci.yml's and the manual check, run on
# the pull request's merge commit; `changes` skips the ones its files don't touch, except `checks` (Python and license
# checks), which runs on every pull request. A branch with a pull request gets its CI only from here (ci.yml runs on
# main). The last job, `PR checks`, always runs and fails when any job failed or was canceled: it is the one check the
# main ruleset requires, so a skipped job never holds a pull request up.
#
# A plain pull_request run: the pull request's own copy of this file, a read-only token, no secrets, no cache scope of
# main's, on GitHub's hosted runners only. A fork's run waits for a maintainer's approval (the repository's fork policy
# is "all external contributors"). A pull request can change this file, and with it its own `PR checks`, so a change
# under .github/ takes the owner's review (.github/CODEOWNERS). Never add secrets, a write permission, a self-hosted
# runner, actions/cache or the pull request's text (title, body, branch name) in a run step to this file. Nothing here
# reads a repository variable: a fork's run may not get them.
name: PR tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.6.4"        # manual.yml's
  TYPST_VERSION: "0.13.1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      src: ${{ steps.files.outputs.src }}
      docs: ${{ steps.files.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 2   # the merge commit (pull_request's default ref) and main, its first parent
          persist-credentials: false
          submodules: false
      - name: What the pull request changes
        id: files
        run: |
          set -eu
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
          src=false; docs=false
          # ci.yml's paths
          grep -qE '^(Makefile|AUTHORS|\.gitmodules|REUSE\.toml|\.github/actions/|(boards|boot|config|core|drivers|hal|platform|tests|third_party|tools|LICENSES)/)' \
            "$RUNNER_TEMP/files" && src=true
          # manual.yml's paths
          grep -qE '^(docs/|README\.md$|tools/build_manual\.sh$|tools/manual/|tools/check_doc_links\.py$)' \
            "$RUNNER_TEMP/files" && docs=true
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "source: $src, docs: $docs"

  unit-tests:
    name: unit tests
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: false   # the host tests use none of third_party
      - name: Install gcovr, tshark, numpy, pytest, pyserial
        run: |
          set -eu
          if [ "${RFOUNDRY_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              gcovr tshark python3-numpy python3-pytest python3-serial
          fi
      - name: Unit tests, once, with coverage and under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1   # LeakSanitizer needs ptrace, which job containers may not allow
          SANITIZE: "1"
        run: tools/coverage.sh
      - name: UI screen gallery
        run: |
          set -eu
          make -s -C tests/host uiSim
          mkdir -p build/ci   # uiSim makes only the last directory
          tests/host/uiSim --gallery build/ci/gallery > build/ci/gallery.log || { grep FAIL build/ci/gallery.log; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: host-logs
          path: |
            build/ci/*.log
            build/ci/gallery/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore

  firmware:
    # one job per toolchain, not per radio or platform: one checkout and one compiler for every board built with it
    # (tools/ci.sh --toolchain takes them from the registry, so a new radio joins with no edit here); 4 cores each
    name: firmware (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the [toolchain] ids of platform/*/platform.toml, with their names; a new platform on a toolchain listed here
        # needs no edit, a new toolchain gets an entry here and its set-up in .github/actions/toolchain
        include:
          - { toolchain: arm, name: Arm }
          - { toolchain: csky, name: C-SKY }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      # the csky-elf image is public (platform.toml [toolchain] image): pulled without logging in
      - name: Toolchain (platform.toml [toolchain])
        id: tc
        uses: ./.github/actions/toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Default builds, warnings, size and app region fit
        env:
          RUN: ${{ steps.tc.outputs.run }}   # empty, or the csky-elf image's run.sh
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -u
          rc=0
          $RUN tools/ci.sh --quick --steps firmware --toolchain "$TOOLCHAIN" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::$TOOLCHAIN builds skipped: the image ${RFOUNDRY_CSKY_IMAGE:-} isn't available on this runner (docs/dev/ci.md)"
            exit 0
          fi
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: firmware-${{ matrix.toolchain }}
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/rfoundry_*.bin
          if-no-files-found: ignore

  checks:
    name: checks   # every pull request: Python and license checks (doc links among them), the manual when docs change
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install numpy, pytest, pyserial
        run: |
          set -eu
          if [ "${RFOUNDRY_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              python3-numpy python3-pytest python3-serial
          fi
      - name: Python checks, license checks
        run: tools/ci.sh --steps registry,python,licenses
      - name: Install pandoc and typst
        if: needs.changes.outputs.docs == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          echo "PANDOC=$RUNNER_TEMP/tools/pandoc-${PANDOC_VERSION}/bin/pandoc" >> "$GITHUB_ENV"
          echo "TYPST=$RUNNER_TEMP/tools/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - name: Build the PDF
        if: needs.changes.outputs.docs == 'true'
        run: |
          set -eu
          VERSION="$(git rev-parse --short=8 HEAD)"
          tools/build_manual.sh --version "$VERSION" --out "build/manual/RadioFoundry-manual-${VERSION}.pdf"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: needs.changes.outputs.docs == 'true'
        with:
          name: manual
          path: build/manual/*.pdf
          if-no-files-found: error

  pr-checks:
    # the check the main ruleset requires; it runs none of the pull request's code
    name: PR checks
    needs: [changes, unit-tests, firmware, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          if [ "$FAILED" != false ]; then
            echo "::error::a job failed or was canceled"
            exit 1
          fi
