#
# CI on every pull request (docs/dev/ci.md "Pull request checks"), from this file as it is on main: a pull request's
# own copy of the workflows never runs here, so a change to them takes the owner's review first (.github/CODEOWNERS).
# The jobs are ci.yml's and the manual check, run on the pull request's merge commit; `changes` skips the ones its
# files don't touch, except `checks` (Python and license checks), which runs on every pull request. A branch with a pull request gets its CI only from here (ci.yml runs on main). The last job
# always runs and sets the `PR checks` commit status on the pull request's head commit: failure when any job failed or
# was canceled, success otherwise. That status is the one check the main ruleset
# requires, so a skipped job never holds a pull request up. It is posted by hand because a pull_request_target run's
# own checks belong to main's commit, not the pull request's.
#
# The pull request's code gets a read-only token that isn't stored in the checkout, no secrets and no cache: nothing
# a fork couldn't have. The C-SKY jobs log in to the image registry with the job's own token, pull the image and log
# out before the build runs. The status job is the only one with a write permission (statuses), and it checks out
# nothing. Never add secrets, another write permission, actions/cache or the pull request's text (title, body, branch
# name) in a run step to this file.
#
# Runners: with the repository variable ODR_CI_RUNNER set, a pull request from a branch of this repository runs on
# that self-hosted runner (tools/ci-runner/); one from a fork always runs on GitHub's hosted runners, since this
# workflow runs every pull request's code without approval. Keep that condition in every job's runs-on.
name: PR tests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ARM_GCC_VERSION: "13.3.rel1"   # ci.yml's and release.yml's pinned toolchain
  ARM_GCC_SHA256: "95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4"
  PANDOC_VERSION: "3.6.4"        # manual.yml's
  TYPST_VERSION: "0.13.1"
  MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge   # the pull request merged into main

jobs:
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      src: ${{ steps.files.outputs.src }}
      docs: ${{ steps.files.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_REF }}
          fetch-depth: 2   # the merge commit and main, its first parent
          persist-credentials: false
          submodules: false
      - name: What the pull request changes
        id: files
        run: |
          set -eu
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
          src=false; docs=false
          # ci.yml's paths
          grep -qE '^(Makefile|AUTHORS|\.gitmodules|REUSE\.toml|(boards|config|core|drivers|hal|platform|tests|third_party|tools|LICENSES)/)' \
            "$RUNNER_TEMP/files" && src=true
          # manual.yml's paths
          grep -qE '^(docs/|README\.md$|tools/build_manual\.sh$|tools/manual/|tools/check_doc_links\.py$)' \
            "$RUNNER_TEMP/files" && docs=true
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "source: $src, docs: $docs"

  unit-tests:
    name: unit tests
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false
          submodules: false   # the host tests use none of third_party
      - name: Install gcovr, tshark, numpy, pytest, pyserial
        run: |
          set -eu
          if [ "${ODR_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              gcovr tshark python3-numpy python3-pytest python3-serial
          fi
      - name: Unit tests, once, with coverage and under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1   # LeakSanitizer needs ptrace, which job containers may not allow
          SANITIZE: "1"
        run: tools/coverage.sh
      - name: UI screen gallery
        run: |
          set -eu
          make -s -C tests/host uiSim
          mkdir -p build/ci   # uiSim makes only the last directory
          tests/host/uiSim --gallery build/ci/gallery > build/ci/gallery.log || { grep FAIL build/ci/gallery.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-logs
          path: |
            build/ci/*.log
            build/ci/gallery/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore

  firmware:
    name: firmware (Arm)   # every Arm radio in one job: one checkout, the Arm toolchain once
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Arm GNU Toolchain (pinned and checksummed; no cache here)
        run: tools/install-arm-toolchain.sh
      - name: Default build, warnings, size and app region fit
        run: |
          set -eu
          tools/ci.sh --quick --steps firmware --board dm1701,md380
          cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-arm
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore

  csky:
    name: firmware (C-SKY)   # every C-SKY radio in one job, beside the Arm one: each runner has 4 cores
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # pulling the private csky-elf image with the job token
    env:
      ODR_CSKY_IMAGE: ${{ vars.ODR_CSKY_IMAGE || 'odr/csky-gcc14:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Pull the image, then log out before the pull request's code runs
        if: vars.ODR_CSKY_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.ODR_CSKY_REGISTRY }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -u
          command -v csky-elf-gcc > /dev/null && exit 0   # the self-hosted image: no Docker, no image to pull
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker pull "$ODR_CSKY_IMAGE" || true   # missing: the build step reports it as skipped
          docker logout "$REGISTRY"
      - name: Default builds in the csky-elf image
        run: |
          set -u
          rc=0
          if command -v csky-elf-gcc > /dev/null; then   # the self-hosted image has the toolchain
            tools/ci.sh --quick --steps firmware --board dm32,dm1801pro,db25d,gd88,gd88b || rc=$?
          else
            tools/docker/csky-toolchain/run.sh tools/ci.sh --quick --steps firmware --board dm32,dm1801pro,db25d,gd88,gd88b || rc=$?
          fi
          if [ "$rc" = 3 ]; then
            echo "::notice::C-SKY builds skipped: the csky-elf image $ODR_CSKY_IMAGE isn't available on this runner (docs/dev/ci.md)"
            exit 0
          fi
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-csky
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore

  checks:
    name: checks   # every pull request: Python and license checks (doc links among them), the manual when docs change
    needs: changes
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false
          submodules: false
      - name: Install numpy, pytest, pyserial
        run: |
          set -eu
          if [ "${ODR_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              python3-numpy python3-pytest python3-serial
          fi
      - name: Python checks, license checks
        run: tools/ci.sh --steps python,licenses
      - name: Install pandoc and typst
        if: needs.changes.outputs.docs == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          echo "PANDOC=$RUNNER_TEMP/tools/pandoc-${PANDOC_VERSION}/bin/pandoc" >> "$GITHUB_ENV"
          echo "TYPST=$RUNNER_TEMP/tools/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - name: Build the PDF
        if: needs.changes.outputs.docs == 'true'
        run: |
          set -eu
          VERSION="$(git rev-parse --short=8 HEAD)"
          tools/build_manual.sh --version "$VERSION" --out "build/manual/OpenDigitalRadio-manual-${VERSION}.pdf"
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.docs == 'true'
        with:
          name: manual
          path: build/manual/*.pdf
          if-no-files-found: error

  pr-checks:
    name: PR checks status
    needs: [changes, unit-tests, firmware, csky, checks]
    if: always()
    # a few seconds of gh at the end: the UI gallery's runner, which is idle by then, so it never holds a build runner
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && (vars.ODR_UI_RUNNER || vars.ODR_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      statuses: write   # the PR checks status on the head commit; this job runs none of the pull request's code
    steps:
      - name: Set PR checks on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          echo "results: $RESULTS"
          if [ "$FAILED" = false ]; then
            state=success; text="every job passed or was skipped"
          else
            state=failure; text="a job failed or was canceled"
          fi
          # The status carries the failure (merge stays blocked); this job exits 0 so the failed job is the only red check
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context="PR checks" \
            -f description="$text" -f target_url="$RUN_URL" > /dev/null
