#
# Posts the UI gallery comment on a pull request (docs/dev/ci.md "UI gallery"), from the `ui-gallery` artifact that
# ui-gallery.yml made. The changed screens are pushed to the `ui-previews` branch (made on first use) and the comment
# links them (blob URLs with ?raw=true, which render for signed-in viewers of a private repository; --attach needs a user
# session, not the job's token). The branch is rebuilt as one parentless commit on every run, keeping the open pull
# requests, the newest 5 closed without a merge and the newest 20 merged, so it never grows; a pull request keeps only its
# newest commit's pictures. Each new commit edits the pull request's one comment, found by its marker line (a new
# comment, and the old one deleted, only when the edit fails).
#
# This is the only workflow with write permissions, and it runs main's copy against every pull request. It never runs
# code from the pull request or the artifact: the artifact is checked as data (names, sizes, PNG signatures, no links,
# the pull request and commit it names), then read by the scripts below, which use only the standard library and gh.
# Never add a checkout of the pull request, a step that runs a script from the artifact, or the pull request's title,
# body or branch name in a run step.
name: UI gallery comment

on:
  workflow_run:
    workflows: ["UI gallery"]
    types: [completed]

permissions:
  contents: read

# one comment at a time: two runs for one pull request never race for the comment
concurrency:
  group: ui-gallery-comment
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true') &&
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write        # the ui-previews branch
      pull-requests: write   # the comment
      actions: read          # the artifact of the run that rendered the gallery
    steps:
      - name: Pull request and head commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          # a pull request's own head commit; a run for an older commit has nothing to post once a newer one exists
          n=$(gh api "repos/$REPO/commits/$HEAD/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$n" ]; then
            echo "::notice::no open pull request for $HEAD; nothing to post"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          current=$(gh api "repos/$REPO/pulls/$n" --jq .head.sha)
          if [ "$current" != "$HEAD" ]; then
            echo "::notice::pull request #$n has moved on to $current; not posting the gallery for $HEAD"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pull request #$n at $HEAD"

      - name: Download the gallery
        if: steps.pr.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: ui-gallery
          path: ui
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the artifact, which is data and never runs
        if: steps.pr.outputs.skip == 'false'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          python3 -I - <<'PY'
          import json, os, re, sys

          PR, HEAD = int(os.environ["PR"]), os.environ["HEAD"]
          root = "ui"
          bad = []
          if not os.path.isdir(root):
              sys.exit("the artifact is missing")
          for dp, dn, fn in os.walk(root):
              for x in dn + fn:
                  if os.path.islink(os.path.join(dp, x)):
                      bad.append(f"symbolic link {os.path.join(dp, x)}")

          with open(os.path.join(root, "manifest.json")) as f:
              m = json.load(f)
          if m.get("pr") != PR:
              bad.append("manifest names another pull request")
          if m.get("head_sha") != HEAD:
              bad.append("manifest names another commit")
          if not re.fullmatch(r"[0-9a-f]{40}", str(m.get("base_sha", ""))):
              bad.append("base_sha is not a commit")
          counts = m.get("counts", {})
          if not all(isinstance(counts.get(k), int) and counts[k] >= 0
                     for k in ("changed", "added", "removed", "unchanged")):
              bad.append("counts are not numbers")

          images = m.get("images")
          expected = set()
          if not isinstance(images, list) or len(images) > 40:
              bad.append("images is not a list of at most 40")
              images = []
          for im in images:
              g, img, names = im.get("geometry"), im.get("image"), im.get("screens")
              if not (isinstance(g, str) and re.fullmatch(r"[0-9]+x[0-9]+[a-z0-9]*", g)):
                  bad.append(f"geometry {g!r}")
                  continue
              if im.get("color") not in ("mono", "color"):
                  bad.append(f"color class of {g}")
                  continue
              if img is None or not re.fullmatch(re.escape(f"compare/{g}-") + r"[0-9]+\.png", str(img)):
                  bad.append(f"image {img!r}")
                  continue
              rows = im.get("rows", 1)
              if not (isinstance(rows, int) and not isinstance(rows, bool) and 0 < rows <= 8):
                  bad.append(f"rows of {img} is not 1 to 8")
              if not (isinstance(names, list) and 0 < len(names) <= 8
                      and all(isinstance(n, str) and re.fullmatch(r"[A-Za-z0-9_]+", n) for n in names)):
                  bad.append(f"screens of {img} are not names")
              p = os.path.join(root, img)
              if not os.path.isfile(p) or os.path.islink(p):
                  bad.append(f"missing {img}")
              else:
                  with open(p, "rb") as f:
                      head = f.read(8)
                  if head != b"\x89PNG\r\n\x1a\n" or os.path.getsize(p) > 8_000_000:
                      bad.append(f"{img} is not a PNG under 8 MB")
              expected.add(img)

          screens = m.get("screens", [])
          if not isinstance(screens, list) or len(screens) > 400:
              bad.append("screens is not a list of at most 400")
          for s in screens if isinstance(screens, list) else []:
              if s.get("status") not in ("changed", "added", "removed") or s.get("image") not in expected:
                  bad.append(f"screen entry {s.get('screen')!r} points at no image")

          actual = set()
          if os.path.isdir(os.path.join(root, "compare")):
              for dp, dn, fn in os.walk(os.path.join(root, "compare")):
                  for x in fn:
                      actual.add(os.path.relpath(os.path.join(dp, x), root).replace(os.sep, "/"))
          if actual != expected:
              bad.append("compare/ holds files the manifest doesn't list, or misses some")

          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"artifact OK: {len(screens)} screens for #{PR} at {HEAD[:7]}")
          PY

      - name: Publish the images to ui-previews
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          KEEP_UNMERGED: "5"    # closed without merging
          KEEP_MERGED: "20"
        run: |
          set -eu
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q previews
          cd previews
          git remote add origin "$SERVER/$REPO.git"
          old=
          if git -c http.extraheader="$auth" fetch -q --depth 1 origin ui-previews; then
            git checkout -q FETCH_HEAD
            old=$(git rev-parse 'FETCH_HEAD^{tree}')
          fi
          # The branch never grows: it is rebuilt as one parentless commit on every run (force-pushed; it holds only
          # pictures that can be regenerated). It keeps the pull requests that are open, the newest KEEP_UNMERGED closed
          # without a merge and the newest KEEP_MERGED merged, among those that have pictures; this one is replaced.
          git checkout -q --orphan fresh
          echo "Pictures for the UI gallery comments (ui-gallery-comment.yml). Rebuilt on every run; nothing to merge." > README.md
          rm -rf "pr-$PR"
          python3 -I - <<'PY'
          import json, os, shutil, subprocess

          repo, cur = os.environ["REPO"], os.environ["PR"]
          keep_unmerged, keep_merged = int(os.environ["KEEP_UNMERGED"]), int(os.environ["KEEP_MERGED"])
          open_, unmerged, merged = [], [], []
          for d in sorted(os.listdir(".")):
              if not (d.startswith("pr-") and d[3:].isdigit()):
                  continue
              n = d[3:]
              r = subprocess.run(["gh", "api", f"repos/{repo}/pulls/{n}"], capture_output=True, text=True)
              if r.returncode != 0:
                  continue   # no such pull request: drop it
              pr = json.loads(r.stdout)
              if pr["state"] == "open":
                  open_.append(d)
              elif pr.get("merged_at"):
                  merged.append((pr["merged_at"], d))
              else:
                  unmerged.append((pr["closed_at"] or "", d))
          keep = set(open_)
          keep |= {d for _, d in sorted(unmerged, reverse=True)[:keep_unmerged]}
          keep |= {d for _, d in sorted(merged, reverse=True)[:keep_merged]}
          for d in sorted(os.listdir(".")):
              if d.startswith("pr-") and d not in keep:
                  shutil.rmtree(d)
                  print(f"dropped {d}")
          print(f"kept {sorted(keep)}")
          PY
          mkdir -p "pr-$PR/$HEAD"
          [ -d ../ui/compare ] && cp -r ../ui/compare "pr-$PR/$HEAD/"
          cp ../ui/manifest.json "pr-$PR/$HEAD/"
          git add -A .
          new=$(git write-tree)
          if [ "$new" = "$old" ]; then
            echo "images for ${HEAD:0:7} are already published"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "UI gallery: pull request #$PR at ${HEAD:0:7}"
          git -c http.extraheader="$auth" push -q --force origin HEAD:ui-previews

      - name: Post the comment
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          # the body is written outside ui/, so the artifact can't shadow it
          export BODY="$RUNNER_TEMP/body.md"
          if [ "$SERVER" = https://github.com ]; then
            export BASE="$SERVER/$REPO/blob/ui-previews/pr-$PR/$HEAD" SUFFIX="?raw=true"
          else
            export BASE="$SERVER/$REPO/raw/branch/ui-previews/pr-$PR/$HEAD" SUFFIX=""
          fi
          python3 -I - <<'PY'
          import datetime, json, os

          FOLD_ROWS = 3   # a composite with more rows than this is collapsed
          m = json.load(open("ui/manifest.json"))
          head, commit, run = os.environ["HEAD"], os.environ["COMMIT_URL"], os.environ["RUN_URL"]
          base, suffix = os.environ["BASE"], os.environ["SUFFIX"]
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          c = m["counts"]
          total = c["changed"] + c["added"] + c["removed"] + c["unchanged"]

          out = ["<!-- odr-ui-gallery -->", "## UI screen gallery", ""]
          out.append(f"Commit [`{head[:7]}`]({commit}) · updated {now} · base `{m['base_sha'][:7]}` · "
                     f"[workflow run]({run})")
          out.append("")
          out.append(f"**{c['changed']} changed**, {c['added']} added, {c['removed']} removed, "
                     f"{c['unchanged']} unchanged ({total} screens).")
          out.append("")
          if not m["images"]:
              out.append("No screen changed: every screen renders as it does on the base commit.")
          else:
              out.append("Each picture stacks the changed screens of one display class, before on the left and after "
                         "on the right (a color page's shots side by side, before above after). Pictures of more than "
                         f"{FOLD_ROWS} rows are folded: open one to see it.")
              geom = kind = None
              for im in m["images"]:
                  if im["color"] != kind:
                      kind = im["color"]
                      out += ["", "### Monochrome displays" if kind == "mono" else "### Color displays"]
                  if im["geometry"] != geom:
                      geom = im["geometry"]
                      out += ["", f"#### {geom} ({kind})", ""]
                  changed = f"Changed: {', '.join(im['screens'])}"
                  picture = f"![{geom} changed screens, before and after]({base}/{im['image']}{suffix})"
                  # a tall composite folds away, so the comment stays short (rows: the compare tool's row count; an
                  # older manifest without it counts the changed screens)
                  rows = im.get("rows", len(im["screens"]))
                  if rows > FOLD_ROWS:
                      out += ["<details>", f"<summary>{changed} ({rows} rows)</summary>", "", picture, "",
                              "</details>", ""]
                  else:
                      out += [changed, "", picture, ""]
          open(os.environ["BODY"], "w").write("\n".join(out) + "\n")
          PY

          # The pull request's gallery comment, found by its marker, is edited in place, so it keeps its spot near the
          # top of the conversation. Only when it can't be edited is a new one posted, and the old one then deleted
          # (after, so the pull request never has none). Any duplicate from an earlier run goes too.
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                --jq '.[] | select(.body | startswith("<!-- odr-ui-gallery -->")) | .id')
          first=$(printf '%s\n' "$ids" | head -n 1)
          extra=$(printf '%s\n' "$ids" | tail -n +2)
          if [ -n "$first" ] && gh api -X PATCH "repos/$REPO/issues/comments/$first" -F "body=@$BODY" > /dev/null; then
            echo "edited comment $first on #$PR"
          else
            new=$(gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$BODY" --jq .id)
            echo "posted comment $new on #$PR"
            extra="$first $extra"
          fi
          for id in $extra; do
            if gh api -X DELETE "repos/$REPO/issues/comments/$id" > /dev/null; then
              echo "deleted comment $id on #$PR"
            else
              echo "::warning::couldn't delete comment $id on #$PR"
            fi
          done
