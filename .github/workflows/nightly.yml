#
# Nightly CI (docs/dev/ci.md): the long builds the per-push workflow leaves out, on the default branch.
#   matrix       one job per platform (stm32f4, hrc7000), every board on it from the registry: a build per feature
#                switch turned off alone, fm-minimal and maximal, each with zero warnings and its size (tools/ci.sh
#                --matrix --platform; about 4-5 minutes per board on the runner). C-SKY in the csky-elf image unless the
#                runner has csky-elf GCC (skipped where the image isn't available)
#   reuse        `reuse lint`, reported as a warning until the tree passes it
# A scheduled run does nothing when the commit it would test already passed a nightly run: a successful run saves
# an empty cache entry named after the commit (nightly-ok-<sha>), and the next scheduled run looks that name up
# first. That works the same on Gitea and GitHub (no API token, no clock arithmetic), catches up after nights the
# runner was off, and an evicted entry only costs one repeated run. A manual run (workflow_dispatch) always builds.
name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC, early morning in the US
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Look up this commit's nightly pass
        id: tested
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .nightly-ok
          key: nightly-ok-${{ github.sha }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ steps.tested.outputs.cache-hit }}" = true ]; then
            echo "::notice::${GITHUB_SHA::8} already passed a nightly run; nothing new to build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  matrix:
    # one job per platform: every board on it in turn (tools/ci.sh --platform, from the registry), so the checkout,
    # submodules and toolchain are set up once per platform, not once per radio
    name: matrix (${{ matrix.platform }})
    needs: changes
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true') && (needs.changes.outputs.run == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # platform/*/platform.toml; a new platform also gets its set-up in .github/actions/toolchain
        platform: [stm32f4, hrc7000]
    permissions:
      contents: read
      packages: read   # pulling a private ghcr.io csky-elf image with the job token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Toolchain (platform.toml [toolchain])
        id: tc
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ matrix.platform }}
          image: ${{ vars.ODR_CSKY_IMAGE }}
          registry: ${{ vars.ODR_CSKY_REGISTRY }}
          # a read-only registry token (secret); on GitHub a ghcr.io package linked to this repository takes the job's
          # own token (packages: read)
          registry-user: ${{ vars.ODR_CSKY_REGISTRY_USER || github.actor }}
          registry-token: ${{ secrets.ODR_CSKY_REGISTRY_TOKEN || github.token }}
      - name: Feature matrix of every board on the platform
        env:
          ODR_CI_PRUNE: "1"   # keep the logs and images, not the build trees (about 65 MB each)
          RUN: ${{ steps.tc.outputs.run }}   # empty, or the csky-elf image's run.sh
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -u
          rc=0
          $RUN tools/ci.sh --matrix --steps firmware --platform "$PLATFORM" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::$PLATFORM matrix skipped: the image ${ODR_CSKY_IMAGE:-} isn't available on this runner (docs/dev/ci.md)"
            exit 0
          fi
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-${{ matrix.platform }}
          path: |
            build/ci/size-report.md
            build/ci/*.log
          if-no-files-found: ignore

  reuse:
    needs: changes
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true') && (needs.changes.outputs.run == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: reuse lint (a warning until the tree passes)
        run: |
          set -u
          if [ -x /opt/reuse/bin/reuse ]; then PATH="/opt/reuse/bin:$PATH"   # the self-hosted runner's image
          else pipx install reuse > /dev/null && PATH="$HOME/.local/bin:$PATH"; fi
          if ! reuse lint; then
            echo "::warning::reuse lint does not pass yet (see the log; docs/dev/ci.md)"
          fi

  mark:
    needs: [matrix]
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Remember that this commit passed
        run: mkdir -p .nightly-ok && date -u > .nightly-ok/stamp
      - uses: actions/cache/save@v4
        with:
          path: .nightly-ok
          key: nightly-ok-${{ github.sha }}
