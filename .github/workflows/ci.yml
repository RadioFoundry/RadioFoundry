#
# Per-push CI (docs/dev/ci.md): everything that takes a few minutes, on every push and pull request that changes
# firmware sources, tests, build tools or this workflow (docs-only changes run only the manual workflow). The pieces
# are tools/ci.sh's steps, so a local `tools/ci.sh --quick` runs the same checks:
#   host       host tests (64 suites, tshark pcap checks), Python checks, license checks, the UI screen gallery
#   coverage   the host tests built with --coverage, gcovr's report (HTML artifact, totals in the job summary)
#   firmware   DM-1701 and MD-380 (UHF and VHF) default builds with zero warnings, the size report, app region fit
#   dm32       the DM-32UV default build in the csky-elf image (repository variable ODR_CSKY_IMAGE, default
#              odr/csky-gcc14:latest); skipped with a notice where that image isn't available (GitHub's runners
#              until it is in a registry)
# The feature matrix and the other long builds run nightly (nightly.yml), the radio tests by hand (hil.yml).
# Runs on Gitea Actions (the self-hosted runner) and GitHub Actions alike; a newer push to the same branch cancels
# the run in progress.
name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "Makefile"
      - "AUTHORS"
      - ".gitmodules"
      - "boards/**"
      - "config/**"
      - "core/**"
      - "drivers/**"
      - "hal/**"
      - "platform/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
      - "LICENSES/**"
      - "REUSE.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Makefile"
      - "AUTHORS"
      - ".gitmodules"
      - "boards/**"
      - "config/**"
      - "core/**"
      - "drivers/**"
      - "hal/**"
      - "platform/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
      - "LICENSES/**"
      - "REUSE.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GCC_VERSION: "13.3.rel1"   # the release workflow's pinned toolchain (release.yml)
  ARM_GCC_SHA256: "95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4"

jobs:
  host:
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the host tests use none of third_party

      - name: Install tshark, numpy, pytest, pyserial
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            tshark python3-numpy python3-pytest python3-serial
          # reuse lint only when the tree is expected to pass it (repository variable ODR_CI_REUSE=true)
          if [ "${{ vars.ODR_CI_REUSE }}" = true ]; then pipx install reuse && echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi

      - name: Host tests, Python checks, license checks
        run: tools/ci.sh --steps host,python,licenses

      - name: UI screen gallery
        run: |
          set -eu
          make -s -C tests/host uiSim
          tests/host/uiSim --gallery build/ci/gallery > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-logs
          path: |
            build/ci/*.log
            build/ci/gallery/
          if-no-files-found: ignore

  coverage:
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install gcovr, tshark, numpy
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcovr tshark python3-numpy
      - name: Coverage of the host tests
        run: tools/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore

  firmware:
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [dm1701, md380]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/opt/arm-gnu-toolchain-${{ env.ARM_GCC_VERSION }}-x86_64-arm-none-eabi
          key: arm-gnu-${{ env.ARM_GCC_VERSION }}-${{ hashFiles('tools/install-arm-toolchain.sh') }}
      - name: Arm GNU Toolchain (pinned, trimmed to the Cortex-M4 multilib)
        run: tools/install-arm-toolchain.sh
      - name: Default build, warnings, size and app region fit
        run: |
          set -eu
          tools/ci.sh --quick --steps firmware --board ${{ matrix.board }}
          cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore

  dm32:
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # pulling a private ghcr.io image with the job token
    env:
      ODR_CSKY_IMAGE: ${{ vars.ODR_CSKY_IMAGE || 'odr/csky-gcc14:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Log in to the image's registry
        if: vars.ODR_CSKY_REGISTRY != ''
        env:
          # a read-only registry token (secret); on GitHub a ghcr.io package linked to this repository takes the job's
          # own token (packages: read)
          REGISTRY_TOKEN: ${{ secrets.ODR_CSKY_REGISTRY_TOKEN || github.token }}
          REGISTRY_USER: ${{ vars.ODR_CSKY_REGISTRY_USER || github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ vars.ODR_CSKY_REGISTRY }}" -u "$REGISTRY_USER" --password-stdin
      - name: DM-32UV default build in the csky-elf image
        run: |
          set -u
          rc=0
          tools/docker/csky-toolchain/run.sh tools/ci.sh --quick --steps firmware --board dm32 || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::DM-32UV build skipped: the csky-elf image $ODR_CSKY_IMAGE isn't available on this runner (docs/dev/ci.md)"
            exit 0
          fi
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Log out of the registry
        if: always() && vars.ODR_CSKY_REGISTRY != ''
        run: docker logout "${{ vars.ODR_CSKY_REGISTRY }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-dm32
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore
