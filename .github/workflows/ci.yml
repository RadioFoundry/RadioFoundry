#
# CI on main (docs/dev/ci.md): everything that takes a few minutes, on every push to main that changes firmware
# sources, tests, build tools or this workflow (docs-only changes run only the manual workflow), and by hand on any
# branch. Pull requests get the same jobs from pr-tests.yml, which runs main's copy of the workflow, never the pull
# request's; a branch isn't tested twice. The pieces are tools/ci.sh's steps and tools/coverage.sh, so a local
# `tools/ci.sh --quick` runs the same checks:
#   unit tests the host tests (64 suites, tshark pcap checks) run once, built with --coverage and under ASan and UBSan
#              (gcovr's report as an artifact, totals in the job summary); the UI screen gallery
#   checks     Python checks (doc links among them), license checks
#   firmware   DM-1701 and MD-380 (UHF and VHF) default builds with zero warnings, the size report, app region fit, in
#              one job
#   csky       the default build of every C-SKY radio (DM-32UV, DM-1801 Pro, DB25-D), in one job beside the Arm one, in the
#              csky-elf image (repository variable ODR_CSKY_IMAGE, default odr/csky-gcc14:latest); skipped with a
#              notice where that image isn't available (GitHub's runners until it is in a registry)
# The feature matrix and the other long builds run nightly (nightly.yml), the radio tests by hand (hil.yml).
# Runs on Gitea Actions (the self-hosted runner) and GitHub Actions alike; a newer push to the same branch cancels
# the run in progress. On GitHub the repository variable ODR_CI_RUNNER (a runner label) moves the jobs from the
# hosted runners to the self-hosted one in tools/ci-runner/, whose image has every tool installed (ODR_CI_IMAGE=1).
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "AUTHORS"
      - ".gitmodules"
      - "boards/**"
      - "config/**"
      - "core/**"
      - "drivers/**"
      - "hal/**"
      - "platform/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
      - "LICENSES/**"
      - "REUSE.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GCC_VERSION: "13.3.rel1"   # the release workflow's pinned toolchain (release.yml)
  ARM_GCC_SHA256: "95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4"

jobs:
  unit-tests:
    name: unit tests
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the host tests use none of third_party

      - name: Install gcovr, tshark
        run: |
          set -eu
          if [ "${ODR_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcovr tshark
          fi

      - name: Unit tests, once, with coverage and under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1   # LeakSanitizer needs ptrace, which job containers may not allow
          SANITIZE: "1"
        run: tools/coverage.sh

      - name: UI screen gallery
        run: |
          set -eu
          make -s -C tests/host uiSim
          mkdir -p build/ci   # uiSim makes only the last directory
          tests/host/uiSim --gallery build/ci/gallery > build/ci/gallery.log || { grep FAIL build/ci/gallery.log; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-logs
          path: |
            build/ci/*.log
            build/ci/gallery/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore

  checks:
    name: checks   # Python and license checks, beside the unit tests
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install numpy, pytest, pyserial
        run: |
          set -eu
          if [ "${ODR_CI_IMAGE:-}" != 1 ]; then   # the self-hosted runner's image has these already
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              python3-numpy python3-pytest python3-serial
          fi
          # reuse lint only when the tree is expected to pass it (repository variable ODR_CI_REUSE=true)
          if [ "${{ vars.ODR_CI_REUSE }}" = true ]; then
            if [ -x /opt/reuse/bin/reuse ]; then echo /opt/reuse/bin >> "$GITHUB_PATH"   # the self-hosted runner's image
            else pipx install reuse && echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
          fi
      - name: Python checks, license checks
        run: tools/ci.sh --steps registry,python,licenses

  firmware:
    name: firmware (Arm)   # every Arm radio in one job: one checkout, the Arm toolchain once
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - uses: actions/cache@v4
        if: runner.environment != 'self-hosted'   # the self-hosted image has the toolchain
        with:
          path: ~/opt/arm-gnu-toolchain-${{ env.ARM_GCC_VERSION }}-x86_64-arm-none-eabi
          key: arm-gnu-${{ env.ARM_GCC_VERSION }}-${{ hashFiles('tools/install-arm-toolchain.sh') }}
      - name: Arm GNU Toolchain (pinned, trimmed to the Cortex-M4 multilib)
        run: tools/install-arm-toolchain.sh
      - name: Default build, warnings, size and app region fit
        run: |
          set -eu
          tools/ci.sh --quick --steps firmware --board dm1701,md380
          cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-arm
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore

  csky:
    name: firmware (C-SKY)   # every C-SKY radio in one job, beside the Arm one: each runner has 4 cores
    if: (github.server_url != 'https://github.com' || vars.ODR_CI_GITHUB == 'true')
    runs-on: ${{ vars.ODR_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # pulling a private ghcr.io image with the job token
    env:
      ODR_CSKY_IMAGE: ${{ vars.ODR_CSKY_IMAGE || 'odr/csky-gcc14:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Log in to the image's registry
        if: vars.ODR_CSKY_REGISTRY != ''
        env:
          # a read-only registry token (secret); on GitHub a ghcr.io package linked to this repository takes the job's
          # own token (packages: read)
          REGISTRY_TOKEN: ${{ secrets.ODR_CSKY_REGISTRY_TOKEN || github.token }}
          REGISTRY_USER: ${{ vars.ODR_CSKY_REGISTRY_USER || github.actor }}
        run: |
          command -v csky-elf-gcc > /dev/null && exit 0   # the self-hosted image: no Docker, no image to pull
          echo "$REGISTRY_TOKEN" | docker login "${{ vars.ODR_CSKY_REGISTRY }}" -u "$REGISTRY_USER" --password-stdin
      - name: Default builds in the csky-elf image
        run: |
          set -u
          rc=0
          if command -v csky-elf-gcc > /dev/null; then   # the self-hosted image has the toolchain
            tools/ci.sh --quick --steps firmware --board dm32,dm1801pro,db25d || rc=$?
          else
            tools/docker/csky-toolchain/run.sh tools/ci.sh --quick --steps firmware --board dm32,dm1801pro,db25d || rc=$?
          fi
          if [ "$rc" = 3 ]; then
            echo "::notice::C-SKY builds skipped: the csky-elf image $ODR_CSKY_IMAGE isn't available on this runner (docs/dev/ci.md)"
            exit 0
          fi
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Log out of the registry
        if: always() && vars.ODR_CSKY_REGISTRY != ''
        run: command -v csky-elf-gcc > /dev/null || docker logout "${{ vars.ODR_CSKY_REGISTRY }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-csky
          path: |
            build/ci/size-report.md
            build/ci/*.log
            build/ci/*/odr_*.bin
          if-no-files-found: ignore
