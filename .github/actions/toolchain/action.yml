#
# A toolchain's pinned compiler for a firmware job (docs/dev/ci.md "Toolchains"): the one place the workflows learn how
# each toolchain gets its compiler. The pin is the [toolchain] table (id, version, sha256, image) of the platforms that
# build with it, read here and by the scripts it calls, never typed into a workflow. A composite action, so it costs no
# job. A new platform on a known toolchain needs no edit here; a new toolchain needs a branch below.
#
#   arm   tools/install-arm-toolchain.sh into ~/opt (a no-op on the self-hosted image, which has it), cached
#   csky  csky-elf-gcc on PATH (the self-hosted image's /opt/csky-elf): nothing to do. Otherwise the csky-elf image
#         (RFOUNDRY_CSKY_IMAGE, default the platform's image): logs in, pulls and logs out right away, and the job runs its
#         build through `run` (tools/docker/csky-toolchain/run.sh, exit status 3 when the image isn't there). No
#         workflow builds csky-elf from source: the image is built by tools/docker/csky-toolchain/build.sh.
#
# Order matters in pr-tests.yml: there this action is main's copy, run before any of the pull request's code, so the
# registry login and logout happen before a script from the pull request runs. The pin is read with awk, not with a
# script from the checkout, for the same reason.
name: Toolchain
description: Installs or finds a toolchain's pinned compiler (the [toolchain] table of platform/*/platform.toml)

inputs:
  toolchain:
    description: The toolchain id ([toolchain] id in platform/*/platform.toml)
    required: true
  cache:
    description: '"true": keep a downloaded toolchain in actions/cache (pr-tests.yml passes "false")'
    default: "true"
  image:
    description: The csky-elf image (repository variable RFOUNDRY_CSKY_IMAGE); empty for the platform's image
    default: ""
  registry:
    description: The image registry to log in to (repository variable RFOUNDRY_CSKY_REGISTRY); empty for none
    default: ""
  registry-user:
    description: The registry user
    default: ""
  registry-token:
    description: A read-only registry token
    default: ""

outputs:
  run:
    description: The command to run a build through, empty when the compiler is on the runner
    value: ${{ steps.pin.outputs.run }}

runs:
  using: composite
  steps:
    - name: Pin (platform.toml [toolchain])
      id: pin
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # tools/platform_toolchain.sh's reading, inline: a quoted value on a "key = value" line of [toolchain]
        pin() { awk -v k="$1" '/^\[/ { t = ($0 == "[toolchain]") } t && $1 == k && $2 == "=" { v = $3; gsub(/"/, "", v); print v; exit }' "$2"; }
        f=""
        for p in platform/*/platform.toml; do
          if [ "$(pin id "$p")" = "$TOOLCHAIN" ]; then f=$p; break; fi
        done
        [ -n "$f" ] || { echo "::error::no platform/*/platform.toml has [toolchain] id = \"$TOOLCHAIN\""; exit 1; }
        # the cache key: the pinned version and the script that installs it
        hash() { sha256sum "$1" | cut -c1-16; }
        cc=$(pin cc "$f"); version=$(pin version "$f"); image=${IMAGE:-$(pin image "$f")}
        run="" mode="" cache_path="" cache_key=""
        case "$TOOLCHAIN" in
        arm)
          mode=install
          cache_path="$HOME/opt/arm-gnu-toolchain-$version-x86_64-arm-none-eabi"
          h=$(hash tools/install-arm-toolchain.sh); cache_key="arm-gnu-$version-$h" ;;
        csky)
          if command -v "$cc" > /dev/null; then
            mode=host
          else
            mode=image
            run=tools/docker/csky-toolchain/run.sh
            echo "RFOUNDRY_CSKY_IMAGE=$image" >> "$GITHUB_ENV"   # run.sh's image
          fi ;;
        *) echo "::error::no set-up for toolchain $TOOLCHAIN in .github/actions/toolchain"; exit 1 ;;
        esac
        echo "$TOOLCHAIN ($f): $cc $version, $mode${run:+ through $run ($image)}"
        { echo "mode=$mode"; echo "run=$run"; echo "cache-path=$cache_path"; echo "cache-key=$cache_key"; } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      if: inputs.cache == 'true' && steps.pin.outputs.cache-path != '' && runner.environment != 'self-hosted'
      with:
        path: ${{ steps.pin.outputs.cache-path }}
        key: ${{ steps.pin.outputs.cache-key }}

    - name: Pull the image, then log out
      if: steps.pin.outputs.mode == 'image' && inputs.registry != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -u
        echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
        docker pull "$RFOUNDRY_CSKY_IMAGE" || true   # missing: run.sh exits 3; the job skips (release.yml fails)
        docker logout "$REGISTRY"

    - name: Arm GNU Toolchain (pinned and checksummed, trimmed to the Cortex-M4 multilib)
      if: steps.pin.outputs.mode == 'install'
      shell: bash
      run: tools/install-arm-toolchain.sh
