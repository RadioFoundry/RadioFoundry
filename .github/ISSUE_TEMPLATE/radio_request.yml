name: New radio
description: Ask for a radio, or share what you know about one.
labels: ["new radio"]
body:
  - type: markdown
    attributes:
      value: |
        **Your radio may already be supported, planned, or requested.** Please check first:

        - Planned radios: The **[All Radios](https://radiofoundry.org/radios/#:~:text=All%20Radios)** list on the RadioFoundry website.
        - [Existing requests](https://github.com/radiofoundry/radiofoundry/issues?q=is%3Aissue+label%3A%22new+radio%22+is%3Aopen). If your radio is there, add a 👍 to that issue

        Please share only facts and your own photos: no firmware, code, or disassembly ([why](https://github.com/radiofoundry/radiofoundry/blob/main/docs/CLEANROOM.md)).
  - type: input
    id: radio
    attributes:
      label: Radio
      description: Write the brand & model. If you know of other names for the radio, include those too.
      placeholder: TYT MD-UV380, Retevis RT3S
    validations:
      required: true
  - type: input
    id: fcc
    attributes:
      label: FCC ID
      description: On the label under the battery. Other IDs (IC, CE, SRRC) are welcome too.
  - type: textarea
    id: hardware
    attributes:
      label: What's inside?
      description: Fill in what you know, and where it's from (label, photo, FCC filing, manual). Blanks are OK.
      value: |
        - Processor:
        - DMR chip:
        - RF chip:
        - Display (size, color/mono, resolution):
        - Flash:
        - GPS:
        - Bluetooth:
        - How do you update the firmware? (USB, cable, bootloader keys):
  - type: textarea
    id: photos
    attributes:
      label: Board photos
      description: Your own photos of the boards, with chip markings readable. Drag them in.
  - type: checkboxes
    id: offer
    attributes:
      label: Can you help?
      options:
        - label: I own this radio and can test builds on it.
        - label: I can lend or donate a unit to a developer.
