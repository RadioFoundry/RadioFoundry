# Labels by path (.github/workflows/labeler.yml; docs/dev/contributing.md "Maintainers"). needs-hil = firmware code or a
# HIL test changed (a HIL test is checked by running it on a radio). risk:low lives in labeler-risk.yml: the workflow
# removes it again when a later push adds a file outside its list.
"needs-hil":
  - changed-files:
      - any-glob-to-any-file: ["core/**", "drivers/**", "platform/**", "hal/**", "boards/**", "config/**", "Makefile", "stub/**", "tests/hil/**"]
"area:dmr":
  - changed-files:
      - any-glob-to-any-file: ["core/dmr/**", "core/air/**", "docs/spec/dmr*.md"]
"area:ui":
  - changed-files:
      - any-glob-to-any-file: ["core/ui/**", "docs/ux/**"]
"area:net":
  - changed-files:
      - any-glob-to-any-file: ["core/net/**", "core/hotspot/**", "core/snmp/**"]
"area:platform":
  - changed-files:
      - any-glob-to-any-file: ["platform/**", "drivers/**", "hal/**", "boards/**"]
"area:site":
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
"area:tools":
  - changed-files:
      - any-glob-to-any-file: ["tools/**", "stub/**"]
"area:tests":
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
"area:ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "tools/ci.sh", "tools/affected.py"]
