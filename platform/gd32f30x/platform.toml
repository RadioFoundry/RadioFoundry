# The GD32F30x platform's registry entry (tools/boards.py): what the tools and CI need to know about every board on it.
# The build itself reads platform.mk, never this file.

id = "gd32f30x"
isa = "arm"
# The SoC every board on the platform has (a board's [hardware] cpu overrides it for the site's table)
cpu = "GD32F303"
# Built by ci.sh with this platform's compiler when any of its boards is selected, then checked against the copy
# stub/f4stub.py embeds (docs/spec/stub-gd32f30x.md)
stubs = ["stub/gd32f30x"]
# The stub's board profiles ([flash.stub]): the host side is stub/f4stub.py, which serves the STM32F4, GD32F30x and
# AT32F43x stubs.
# The record holds the board id and the bootloader's end (the image's APP_BASE), so a profile needs no other key
board_stub = { tool = "f4stub", keys = [], optional = [] }
# Linker symbols every board's scripts must define: none (no codec in flash)
codec_symbols = []
# Program flash starts here. The vendor bootloader holds the flash from here to a board's image (its linker FLASH
# origin), which is never written
flash_base = 0x08000000
# The geometry a board's [flash] sectors names unless it says otherwise
default_sectors = "gd32f303"

# Flash geometries: [index, address, size]. GD32F303 high and extra density: 2 KB pages in the first 512 KB, 4 KB
# pages above (GD32F30x user manual, FMC). Listed up to 1 MB, the most an image and its codec slot use
[sectors]
