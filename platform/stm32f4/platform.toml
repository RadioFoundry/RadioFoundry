# The STM32F4 platform's registry entry (tools/boards.py): what the tools and CI need to know about every board on it.
# The build itself reads platform.mk, never this file.

id = "stm32f4"
isa = "arm"
# The compiler print-cc names, and what installs it when it's missing (ci.sh's skip message)
toolchain = { cc = "arm-none-eabi-gcc", build = "tools/install-arm-toolchain.sh" }
# One CI job per group; the Arm group installs the pinned toolchain on the runner, no container
ci = { group = "Arm", container = false }
# Built by ci.sh with this platform's compiler when any of its boards is selected: the flash stub CONFIG_STUB_ENTRY loads
stubs = ["stub/stm32f4"]

# Flash geometries a board's [flash] sectors names: [index, address, size] in the order the stock bootloader erases
# them. STM32F405, 1 MB: sectors 0-3 16 KB, 4 64 KB, 5-11 128 KB (reference manual, flash module organization).
# Sectors 0-2 hold the stock bootloader and are not listed
[sectors]
f405 = [
	[3, 0x0800C000, 0x4000],
	[4, 0x08010000, 0x10000],
	[5, 0x08020000, 0x20000],
	[6, 0x08040000, 0x20000],
	[7, 0x08060000, 0x20000],
	[8, 0x08080000, 0x20000],
	[9, 0x080A0000, 0x20000],
	[10, 0x080C0000, 0x20000],
	[11, 0x080E0000, 0x20000],
]
