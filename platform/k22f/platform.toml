# The K22F platform's registry entry (tools/boards.py): what the tools and CI need to know about every board on it.
# The build itself reads platform.mk, never this file.

id = "k22f"
isa = "arm"
# The SoC every board on the platform has (a board's [hardware] cpu overrides it for the site's table)
cpu = "MK22FN512"
# The compiler print-cc names and what installs it when it's missing (ci.sh's skip message), in its own table at the
# end of this file
# Built by ci.sh with this platform's compiler when any of its boards is selected: the flash stub CONFIG_STUB_ENTRY loads
stubs = ["stub/k22f"]
# Every board's [flash.stub] is its record for that stub (stub/k22stub.py, stub-k22f.md): the SPI NOR on GPIO pins
# (pins.h PIN_NOR_*) with its chip select's idle state and write floor, and where an image merged with the codec ends
board_stub = { tool = "k22stub", keys = ["spi_gpio", "codec_image_end"], optional = [] }
# Linker symbols every board's scripts must define: the codec's area in program flash, which the merge fills
# (docs/spec/codec-gd77.md)
codec_symbols = ["__codec_slot", "__codec_slot_end"]
# Program flash starts here. The radio's bootloader holds the flash from here to a board's image (its linker FLASH
# origin), which is never written
flash_base = 0x00000000
# The geometry a board's [flash] sectors names unless it says otherwise
default_sectors = "mk22fn512"

# Flash geometries: [index, address, size]. MK22FN512, 512 KB: 256 sectors of 2 KB (reference manual, flash memory
# module). A board's sectors are those from its image up, less the ones its [flash] protect keeps
[sectors]
