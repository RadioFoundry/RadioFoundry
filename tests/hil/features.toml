#
# The feature checklist (tests/hil/README.md, "Bring-up mode"): one entry per feature, never a column per radio. A
# radio's state for each entry is resolved by tools/bringup.py from its build data (BOARD_UNSUPPORTED, the switch
# defaults) and the [features.<id>] overrides of its board.toml, so a new radio adds nothing here. tools/bringup.py
# check (tools/ci.sh) fails when a switch of config/features.mk has no entry or a listed test isn't collected.
#
# Fields:
#   id              stable name, snake case
#   switch          the CONFIG_ switch without the prefix; left out for a feature without one
#   summary         one line
#   spec            the doc that defines the feature
#   source          paths whose change makes a recorded result stale (default: the files and directories the
#                   Makefile builds for the switch, else the files that test CONFIG_<switch>; the spec always counts)
#   tests           required HIL tests by node id, in order. The first is the capability gate when the feature needs
#                   hardware glue. Empty: the feature has no HIL test, and bringup.py status says so
#   optional_tests  run and recorded, but they don't gate
#   planned_tests   required tests not written yet: the feature shows as incomplete until they exist and pass
#   needs           what the tests need: radio, rf (--allow-rf), bench (the SDR bench), second_radio
#                   (--split-rx-port or --bench-station), owner_action (--manual: a person at the radio),
#                   usb_switch (--allow-usb-switch), codeplug_write (--allow-codeplug-write), reboot (--allow-reboot)
#   owner           a [feature.owner] table, last in the entry: node id = the owner action the test asks for, so
#                   a run can ask for them in one batch
#   host_tests      tests/host programs that cover the feature
#   doc_claims      docs that claim the feature (default for a switch: docs/feature-matrix.md)

# ── Radio and voice ──

[[feature]]
id = "fm"
switch = "FM"
summary = "Analog FM receive and transmit"
spec = "docs/spec/radio-features.md"
source = ["core/radio", "drivers/rf", "hal/hal_radio.h", "hal/hal_audio.h"]
tests = [
    "tests/hil/test_fm.py::test_noaa_receive",
    "tests/hil/test_fm_tx.py::test_fm_tx_bandwidth",
    "tests/hil/test_fm_tx.py::test_fm_tx_power_levels",
    "tests/hil/test_ui.py::test_quick_monitor_latch",
]
optional_tests = ["tests/hil/test_mic_gain.py::test_mic_gain_deviation"]
needs = ["radio", "rf", "bench", "owner_action"]
host_tests = ["radioCoreTest", "micGainTest", "at1846sTest", "bk4819Test", "fd6818Test"]
doc_claims = ["docs/feature-matrix.md", "docs/user/07-fm.md"]

[feature.owner]
"tests/hil/test_mic_gain.py::test_mic_gain_deviation" = """\
    key PTT and speak or whistle into the microphone in each recording window; on a radio whose programming \
    cable mutes the microphone, take the cable out for each over"""

