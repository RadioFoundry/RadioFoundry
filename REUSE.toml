SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["platform/stm32f4/stm32f4xx_hal_conf.h", "platform/stm32f4/LICENSE-STM32F4xx-HAL.txt"]
SPDX-FileCopyrightText = "2017 STMicroelectronics"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["site/templates/**", "site/**/*.json", "site/**/*.png", "site/**/*.svg"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["stub/*.bin"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

# Data with no room for a comment: the test voice set (synthesized speech, tests/data/voice/README.md), test vectors,
# the codec maps and the generated board registry, the CI proxy's allow list, and the web page served from flash
# (a comment there would cost flash)
[[annotations]]
path = ["tests/data/voice/**", "tests/host/data/**", "tools/rfoundry/rfoundry/codec_maps/**",
        "tools/rfoundry/rfoundry/registry.json", "tools/rfoundry/tests/*.json", "tools/ci-runner/proxy/allow",
        "core/net/http_assets/index.html"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"
